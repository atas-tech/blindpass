<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
<style>
#bp-dashboard{--bp-bg:#0b0e0d;--bp-panel:#101512;--bp-raised:#151b17;--bp-text:#f0f3ed;--bp-muted:#9ca59d;--bp-line:#27302a;--bp-line-strong:#5a6a60;--bp-lime:#c5f277;--bp-soft:#202b19;--bp-amber:#ebc17c;--bp-red:#f2a8a0;--bp-radius:6px;--bp-row:18px;color-scheme:dark;background:var(--bp-bg);color:var(--bp-text);font:400 14px/1.5 Inter,Arial,sans-serif;min-width:0;isolation:isolate}
#bp-dashboard *{box-sizing:border-box}
#bp-dashboard [hidden]{display:none!important}
#bp-dashboard h1,#bp-dashboard h2,#bp-dashboard h3,#bp-dashboard p{margin:0;color:inherit}
#bp-dashboard h1{font-size:32px;font-weight:500;line-height:1.18;letter-spacing:-1.4px}
#bp-dashboard h2{font-size:16px;font-weight:500;line-height:1.5;letter-spacing:-.3px}
#bp-dashboard h3{font-size:15px;font-weight:500;line-height:1.5}
#bp-dashboard button,#bp-dashboard input,#bp-dashboard select{font:inherit;color:inherit}
#bp-dashboard button{cursor:pointer;touch-action:manipulation}
#bp-dashboard button:disabled{cursor:default;opacity:.5}
#bp-dashboard button:focus-visible,#bp-dashboard input:focus-visible,#bp-dashboard select:focus-visible{outline:2px solid var(--bp-lime);outline-offset:3px}
#bp-dashboard svg{width:17px;height:17px;flex-shrink:0;stroke-width:1.6}
#bp-dashboard .bp-shell{display:grid;grid-template-columns:194px minmax(0,1fr);min-height:800px}
#bp-dashboard .bp-sidebar{background:var(--bp-panel);border-right:1px solid var(--bp-line);display:flex;flex-direction:column;padding:27px 15px 18px;gap:25px}
#bp-dashboard .bp-brand{display:flex;align-items:center;gap:9px;font-size:23px;line-height:1;letter-spacing:-1px;font-weight:500;padding:0 8px}
#bp-dashboard .bp-brand em{color:var(--bp-lime);font-style:normal}
#bp-dashboard .bp-mark{width:23px;height:25px;display:grid;grid-template-columns:1fr 1fr;gap:4px;transform:skewY(-9deg);flex-shrink:0}
#bp-dashboard .bp-mark i{background:var(--bp-lime);display:block}
#bp-dashboard .bp-mark i:nth-child(1){border-radius:3px 0 0 0}#bp-dashboard .bp-mark i:nth-child(2){border-radius:0 5px 0 0;opacity:.7}#bp-dashboard .bp-mark i:nth-child(3){border-radius:0 0 0 3px;opacity:.7}#bp-dashboard .bp-mark i:nth-child(4){border-radius:0 0 5px 0}
#bp-dashboard .bp-workspace{border:1px solid var(--bp-line);border-radius:var(--bp-radius);padding:12px;display:flex;gap:10px;align-items:center}
#bp-dashboard .bp-avatar{height:31px;width:31px;background:var(--bp-raised);border:1px solid var(--bp-line);border-radius:5px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
#bp-dashboard .bp-workspace strong{font-weight:500;font-size:12px;display:block}
#bp-dashboard .bp-small{font-size:12px;line-height:1.6;color:var(--bp-muted)}
#bp-dashboard .bp-kicker{font:400 11px/1.6 Consolas,"Liberation Mono",monospace;letter-spacing:1.1px;text-transform:uppercase;color:var(--bp-muted)}
#bp-dashboard .bp-nav-group>.bp-kicker{padding:0 10px;margin-bottom:9px}
#bp-dashboard .bp-nav{display:flex;flex-direction:column;gap:5px}
#bp-dashboard .bp-nav button{display:flex;align-items:center;gap:10px;text-align:left;min-height:39px;border:1px solid transparent;border-radius:4px;background:transparent;padding:8px 10px;font-size:12px;color:var(--bp-muted);width:100%}
#bp-dashboard .bp-nav button:hover{background:var(--bp-raised);color:var(--bp-text)}
#bp-dashboard .bp-nav button[aria-current="page"]{color:var(--bp-lime);background:var(--bp-soft);border-color:#354326}
#bp-dashboard .bp-counter{margin-left:auto;border-radius:3px;padding:0 6px;background:var(--bp-raised);font:400 11px/20px Consolas,monospace;color:var(--bp-lime)}
#bp-dashboard .bp-sidebar-bottom{margin-top:auto;border-top:1px solid var(--bp-line);padding:17px 6px 0;display:flex;gap:10px;align-items:center}
#bp-dashboard .bp-main{min-width:0}
#bp-dashboard .bp-topbar{height:65px;border-bottom:1px solid var(--bp-line);padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}
#bp-dashboard .bp-crumb{display:flex;align-items:center;gap:12px;color:var(--bp-muted);font-size:12px}
#bp-dashboard .bp-crumb span:last-child{color:var(--bp-text)}
#bp-dashboard .bp-demo{font:400 11px/1.4 Consolas,monospace;letter-spacing:.8px;border:1px solid var(--bp-line);padding:5px 7px;color:var(--bp-muted);white-space:nowrap}
#bp-dashboard .bp-button.bp-mobile-menu{display:none}
#bp-dashboard .bp-content{padding:31px 30px 24px}
#bp-dashboard .bp-page-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:27px}
#bp-dashboard .bp-page-heading .bp-kicker{color:var(--bp-lime);margin-bottom:10px}
#bp-dashboard .bp-page-heading p{color:var(--bp-muted);font-size:12px;margin-top:10px;max-width:490px}
#bp-dashboard .bp-lime{color:var(--bp-lime)}
#bp-dashboard .bp-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--bp-line-strong);background:var(--bp-panel);border-radius:4px;min-height:36px;padding:8px 12px;font-size:12px;white-space:nowrap}
#bp-dashboard .bp-button:hover{background:var(--bp-raised);border-color:#526048}
#bp-dashboard .bp-button-primary{color:var(--bp-bg);background:var(--bp-lime);border-color:var(--bp-lime)}
#bp-dashboard .bp-button-primary:hover{background:#d2f69a;border-color:#d2f69a}
#bp-dashboard .bp-button-quiet{background:transparent;border:0;padding:5px 0;color:var(--bp-muted);min-height:30px}
#bp-dashboard .bp-button-quiet:hover{color:var(--bp-lime);background:transparent}
#bp-dashboard .bp-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--bp-line);border-radius:var(--bp-radius);background:var(--bp-panel);margin-bottom:25px}
#bp-dashboard .bp-metric{padding:18px 20px;min-width:0;border-right:1px solid var(--bp-line)}
#bp-dashboard .bp-metric:last-child{border-right:0}
#bp-dashboard .bp-metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--bp-muted);gap:8px;font-size:12px}
#bp-dashboard .bp-value{font-size:31px;letter-spacing:-1.2px;line-height:1.2;font-weight:500;margin:12px 0 7px;font-variant-numeric:tabular-nums}
#bp-dashboard .bp-value span{font-size:13px;color:var(--bp-muted);letter-spacing:0;font-weight:400}
#bp-dashboard .bp-meter{height:3px;background:var(--bp-line);margin-top:13px}
#bp-dashboard .bp-meter i{display:block;height:100%;width:12.8%;background:var(--bp-lime)}
#bp-dashboard .bp-section{border:1px solid var(--bp-line);background:var(--bp-panel);border-radius:var(--bp-radius);min-width:0;overflow:hidden}
#bp-dashboard .bp-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 19px;border-bottom:1px solid var(--bp-line)}
#bp-dashboard .bp-section-title{display:flex;align-items:center;gap:10px;min-width:0}
#bp-dashboard .bp-section-title>svg{color:var(--bp-lime)}
#bp-dashboard .bp-attention{font:400 11px/1.4 Consolas,monospace;color:var(--bp-amber)}
#bp-dashboard .bp-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;background:transparent}
#bp-dashboard .bp-table th{font-weight:400;color:var(--bp-muted);font-size:11px;text-transform:uppercase;letter-spacing:.65px;background:var(--bp-raised);padding:10px 18px}
#bp-dashboard .bp-table td{padding:var(--bp-row) 18px;border-top:1px solid var(--bp-line);vertical-align:middle;overflow-wrap:anywhere}
#bp-dashboard .bp-table strong{font-weight:500;display:block}
#bp-dashboard .bp-table small{display:block;color:var(--bp-muted);font-size:11px;margin-top:3px}
#bp-dashboard .bp-table .bp-button{min-height:30px;padding:5px 9px;font-size:11px}
#bp-dashboard .bp-mono{font-family:Consolas,"Liberation Mono",monospace;font-size:11px;overflow-wrap:anywhere}
#bp-dashboard .bp-table-wrap{overflow-x:auto}
#bp-dashboard .bp-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:3px;background:var(--bp-soft);color:var(--bp-lime);font-size:11px;line-height:1.5;white-space:nowrap}
#bp-dashboard .bp-tag-wait{background:#2c2419;color:var(--bp-amber)}
#bp-dashboard .bp-tag-neutral{background:var(--bp-raised);color:var(--bp-muted)}
#bp-dashboard .bp-tag-red{background:#2a1f1d;color:var(--bp-red)}
#bp-dashboard .bp-tag svg{width:11px;height:11px}
#bp-dashboard .bp-bottom-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:24px}
#bp-dashboard .bp-feed{list-style:none;padding:0 19px;margin:0}
#bp-dashboard .bp-feed li{display:grid;grid-template-columns:19px minmax(0,1fr) auto;gap:11px;align-items:start;padding:16px 0;border-bottom:1px solid var(--bp-line);font-size:12px}
#bp-dashboard .bp-feed li:last-child{border:0}
#bp-dashboard .bp-feed svg{color:var(--bp-muted);margin-top:2px}
#bp-dashboard .bp-feed small{display:block;color:var(--bp-muted);font-size:11px;margin-top:3px}
#bp-dashboard .bp-feed time{color:var(--bp-muted);font:400 11px/1.8 Consolas,monospace}
#bp-dashboard .bp-policy-body{padding:19px}
#bp-dashboard .bp-policy-line{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:14px}
#bp-dashboard .bp-policy-line span{color:var(--bp-muted)}
#bp-dashboard .bp-policy-line strong{font-weight:400;text-align:right}
#bp-dashboard .bp-boundary{display:flex;gap:9px;color:var(--bp-muted);font-size:11px;line-height:1.7;border-top:1px solid var(--bp-line);padding-top:13px;margin-top:17px}
#bp-dashboard .bp-boundary svg{color:var(--bp-lime);margin-top:2px}
#bp-dashboard .bp-footer{margin-top:24px;display:flex;justify-content:space-between;gap:15px;color:var(--bp-muted);font:400 11px/1.5 Consolas,monospace}
#bp-dashboard .bp-split{display:grid;grid-template-columns:245px minmax(0,1fr);border:1px solid var(--bp-line);border-radius:var(--bp-radius);background:var(--bp-panel);overflow:hidden}
#bp-dashboard .bp-queue{border-right:1px solid var(--bp-line);padding:10px}
#bp-dashboard .bp-queue-label{padding:7px 8px 16px;color:var(--bp-muted);font-size:11px}
#bp-dashboard .bp-request{display:block;width:100%;text-align:left;padding:16px 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--bp-muted);margin-bottom:5px}
#bp-dashboard .bp-request[aria-pressed="true"]{background:var(--bp-raised);border-color:#48533c;color:var(--bp-text)}
#bp-dashboard .bp-request strong{display:block;font-size:12px;font-weight:500;margin:10px 0 4px}
#bp-dashboard .bp-request small{font-size:11px;color:var(--bp-muted);display:block;overflow-wrap:anywhere}
#bp-dashboard .bp-detail{padding:24px;min-width:0}
#bp-dashboard .bp-detail-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:22px}
#bp-dashboard .bp-detail h2{font-size:22px;line-height:1.35;letter-spacing:-.6px}
#bp-dashboard .bp-detail>p{font-size:12px;color:var(--bp-muted);margin-top:9px}
#bp-dashboard .bp-details{margin:21px 0 0}
#bp-dashboard .bp-details>div{display:grid;grid-template-columns:105px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--bp-line);font-size:12px}
#bp-dashboard .bp-details dt{color:var(--bp-muted)}
#bp-dashboard .bp-details dd{margin:0;overflow-wrap:anywhere}
#bp-dashboard .bp-detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}
#bp-dashboard .bp-notice{background:var(--bp-raised);border:1px solid var(--bp-line);border-radius:4px;display:flex;gap:10px;padding:14px;margin-top:19px;color:var(--bp-muted);font-size:11px;line-height:1.7}
#bp-dashboard .bp-notice svg{color:var(--bp-lime);margin-top:2px}
#bp-dashboard .bp-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:17px}
#bp-dashboard .bp-toolbar button[aria-pressed="true"]{color:var(--bp-lime);border-color:#48533c;background:var(--bp-soft)}
#bp-dashboard .bp-empty{padding:45px 24px;text-align:center;color:var(--bp-muted)}
#bp-dashboard .bp-empty svg{width:25px;height:25px;color:var(--bp-lime);margin:0 auto 12px;display:block}
#bp-dashboard .bp-empty h2{color:var(--bp-text);margin-bottom:7px}
#bp-dashboard .bp-live{color:var(--bp-lime);font-size:12px;margin:0 0 18px}
#bp-dashboard .bp-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
#bp-dashboard .bp-field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--bp-muted);margin:15px 0}
#bp-dashboard .bp-field input,#bp-dashboard .bp-field select{border:1px solid var(--bp-line-strong);border-radius:4px;background:var(--bp-bg);padding:10px 12px;min-width:0;width:100%;color:var(--bp-text)}
#bp-dashboard .bp-rules{display:flex;flex-direction:column;gap:15px}
#bp-dashboard .bp-rule{padding:20px;border:1px solid var(--bp-line);border-radius:var(--bp-radius);background:var(--bp-panel)}
#bp-dashboard .bp-rule-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
#bp-dashboard .bp-rule-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
#bp-dashboard .bp-rule-body strong{display:block;font-weight:400;font-size:12px;margin-top:5px;overflow-wrap:anywhere}
@media(max-width:900px){#bp-dashboard .bp-shell{grid-template-columns:172px minmax(0,1fr)}#bp-dashboard .bp-sidebar{padding-inline:10px}#bp-dashboard .bp-brand{font-size:21px}#bp-dashboard .bp-content{padding:25px 22px}#bp-dashboard .bp-topbar{padding-inline:22px}#bp-dashboard .bp-page-heading{align-items:flex-start;flex-wrap:wrap}#bp-dashboard .bp-bottom-grid{grid-template-columns:1fr}#bp-dashboard .bp-split{grid-template-columns:1fr}#bp-dashboard .bp-queue{display:flex;gap:7px;border-right:0;border-bottom:1px solid var(--bp-line);flex-wrap:wrap}#bp-dashboard .bp-queue-label{width:100%;padding-bottom:3px}#bp-dashboard .bp-request{flex:1;min-width:140px}#bp-dashboard .bp-metric{padding:16px 14px}#bp-dashboard .bp-table td,#bp-dashboard .bp-table th{padding-inline:13px}}
@media(max-width:650px){#bp-dashboard .bp-shell{display:block;min-height:0}#bp-dashboard .bp-sidebar{display:none}#bp-dashboard[data-menu="open"] .bp-sidebar{display:flex;border-right:0;border-bottom:1px solid var(--bp-line)}#bp-dashboard .bp-nav{display:grid;grid-template-columns:1fr 1fr}#bp-dashboard .bp-sidebar-bottom{display:none}#bp-dashboard .bp-topbar{padding:0 16px;height:59px}#bp-dashboard .bp-button.bp-mobile-menu{display:inline-flex}#bp-dashboard .bp-crumb{gap:8px}#bp-dashboard .bp-crumb>span:not(:last-child){display:none}#bp-dashboard .bp-demo{white-space:normal;width:116px;flex-shrink:0;text-align:right}#bp-dashboard .bp-topbar{gap:10px;min-height:65px;height:auto;padding-block:10px}#bp-dashboard .bp-content{padding:24px 16px}#bp-dashboard h1{font-size:29px}#bp-dashboard .bp-page-heading{margin-bottom:23px}#bp-dashboard .bp-metrics{grid-template-columns:1fr}#bp-dashboard .bp-metric{border-right:0;border-bottom:1px solid var(--bp-line);display:grid;grid-template-columns:1fr auto;gap:3px 12px}#bp-dashboard .bp-metric:last-child{border-bottom:0}#bp-dashboard .bp-metric-top{grid-column:1}#bp-dashboard .bp-metric-top svg{display:none}#bp-dashboard .bp-value{grid-column:2;grid-row:1/3;margin:0;font-size:25px}#bp-dashboard .bp-meter{grid-column:1/3;margin-top:8px}#bp-dashboard .bp-table{min-width:470px}#bp-dashboard .bp-detail{padding:19px}#bp-dashboard .bp-details>div{grid-template-columns:88px minmax(0,1fr);gap:10px}#bp-dashboard .bp-footer{flex-wrap:wrap}#bp-dashboard .bp-edit-grid,#bp-dashboard .bp-rule-body{grid-template-columns:1fr}#bp-dashboard .bp-section-head{padding:15px}#bp-dashboard .bp-request{min-width:100%}}
@media(pointer:coarse){#bp-dashboard button,#bp-dashboard .bp-nav button,#bp-dashboard .bp-button-quiet,#bp-dashboard .bp-table .bp-button{min-height:44px}#bp-dashboard input,#bp-dashboard select{font-size:16px}}
</style>
<div id="bp-dashboard" aria-label="BlindPass dashboard redesign">
  <div class="bp-shell">
    <aside class="bp-sidebar">
      <div class="bp-brand"><span class="bp-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>blindpass<em>.</em></span></div>
      <div class="bp-workspace"><span class="bp-avatar">AT</span><div><strong>Atas workspace</strong><span class="bp-small">Admin access</span></div></div>
      <div class="bp-nav-group"><p class="bp-kicker">Access control</p><nav class="bp-nav" aria-label="Access control">
        <button type="button" data-page="overview" aria-current="page"><i data-lucide="layout-dashboard" aria-hidden="true"></i>Overview</button>
        <button type="button" data-page="approvals"><i data-lucide="shield-check" aria-hidden="true"></i>Approvals<span class="bp-counter" id="bp-nav-count">3</span></button>
        <button type="button" data-page="agents"><i data-lucide="bot" aria-hidden="true"></i>Agents</button>
        <button type="button" data-page="policy"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>Exchange policy</button>
        <button type="button" data-page="audit"><i data-lucide="list-filter" aria-hidden="true"></i>Audit log</button>
      </nav></div>
      <div class="bp-nav-group"><p class="bp-kicker">Workspace</p><nav class="bp-nav" aria-label="Workspace">
        <button type="button" data-page="members"><i data-lucide="users" aria-hidden="true"></i>Members</button>
        <button type="button" data-page="usage"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>Usage & billing</button>
        <button type="button" data-page="settings"><i data-lucide="settings-2" aria-hidden="true"></i>Settings</button>
      </nav></div>
      <div class="bp-sidebar-bottom"><span class="bp-avatar">OP</span><div><div style="font-size:12px">Demo operator</div><div class="bp-small">Administrator</div></div></div>
    </aside>
    <div class="bp-main">
      <header class="bp-topbar"><div class="bp-crumb"><button type="button" class="bp-button bp-mobile-menu" aria-label="Toggle navigation" aria-expanded="false"><i data-lucide="menu" aria-hidden="true"></i></button><span>Workspace</span><span aria-hidden="true">/</span><span id="bp-breadcrumb">Overview</span></div><span class="bp-demo">DESIGN PREVIEW · SAMPLE DATA</span></header>
      <main class="bp-content"><div id="bp-notification" class="bp-live" role="status" aria-live="polite" hidden></div><div id="bp-page"></div><footer class="bp-footer"><span>blindpass / encrypted provisioning</span><span>Autonomy, with boundaries.</span></footer></main>
    </div>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('bp-dashboard');
  const page = root.querySelector('#bp-page');
  const settings = {density:'Comfortable',corners:6};
  const state = {page:'overview',selected:0,agentFilter:'all',notice:'',decisions:{}};
  const requests = [
    {id:'apr_demo_001',agent:'release-agent',name:'Release agent',secret:'staging_api_key',purpose:'Validate a staging release',fulfiller:'ops-agent',rule:'staging-release-review',remaining:'1m 42s',time:'09:32',urgent:true},
    {id:'apr_demo_002',agent:'support-agent',name:'Support agent',secret:'support_api_token',purpose:'Fetch a support case summary',fulfiller:'ops-agent',rule:'support-review',remaining:'6m 18s',time:'09:37',urgent:false},
    {id:'apr_demo_003',agent:'report-agent',name:'Report agent',secret:'reports_api_key',purpose:'Compile the daily report',fulfiller:'ops-agent',rule:'reports-review',remaining:'8m 05s',time:'09:39',urgent:false}
  ];
  const agents = ['release-agent','support-agent','report-agent','ops-agent','docs-agent','test-agent','legacy-agent'];
  const pending = () => requests.filter(r => !state.decisions[r.id]);
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const tag = (text,kind='') => `<span class="bp-tag ${kind}">${text}</span>`;
  const button = (text,action,primary=false) => `<button type="button" class="bp-button ${primary?'bp-button-primary':''}" ${action}>${text}</button>`;
  const heading = (kicker,title,sub,action='') => `<div class="bp-page-heading"><div><div class="bp-kicker">${kicker}</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`;
  const titles = {overview:'Overview',approvals:'Approvals',agents:'Agents',policy:'Exchange policy',audit:'Audit log',members:'Members',usage:'Usage & billing',settings:'Settings'};
  function feed(full=false) {
    const actions = requests.filter(r => state.decisions[r.id]).map(r => ({name:`Exchange ${state.decisions[r.id]}`,meta:r.agent,time:'Now',icon:state.decisions[r.id]==='approved'?'check':'x'}));
    const events = [...actions,{name:'Exchange completed',meta:'docs-agent · docs_api_key',time:'09:38',icon:'arrow-left-right'},{name:'Agent enrolled',meta:'test-agent · demo operator',time:'09:25',icon:'bot'},{name:'Policy updated',meta:'Version 12 · demo operator',time:'09:14',icon:'sliders-horizontal'}];
    if(full){events.push(...requests.map(r=>({name:'Approval requested',meta:r.agent+' · '+r.id,time:r.time,icon:'shield-check'})));events.sort((a,b)=>(b.time==='Now'?'99:99':b.time).localeCompare(a.time==='Now'?'99:99':a.time));}
    return `<ul class="bp-feed">${events.slice(0,full?12:3).map(e=>`<li>${icon(e.icon)}<div>${e.name}<small>${e.meta}</small></div><time>${e.time}</time></li>`).join('')}</ul>`;
  }
  function overview() {
    return heading('Your workspace, at a glance','Access, <span class="bp-lime">under control.</span>','Review requests. Set the boundaries. Keep work moving.',button('Review approvals '+icon('arrow-right'),'data-page="approvals"',true))+
    `<div class="bp-metrics"><div class="bp-metric"><div class="bp-metric-top">Active agents${icon('bot')}</div><div class="bp-value">6 <span>/ 10</span></div><div class="bp-small">Enrolled in this workspace</div></div><div class="bp-metric"><div class="bp-metric-top">Pending in latest results${icon('shield-check')}</div><div class="bp-value">${pending().length.toString().padStart(2,'0')}</div><div class="bp-small">${pending().some(r=>r.urgent)?'<span style="color:var(--bp-amber)">1 expires in under 2 minutes</span>':'Review the remaining requests'}</div></div><div class="bp-metric"><div class="bp-metric-top">Secret requests${icon('arrow-left-right')}</div><div class="bp-value">128 <span>/ 1,000</span></div><div class="bp-small">This month · resets Oct 1</div><div class="bp-meter" role="meter" aria-label="Monthly secret requests" aria-valuenow="128" aria-valuemin="0" aria-valuemax="1000"><i></i></div></div></div>`+
    `<section class="bp-section"><div class="bp-section-head"><div class="bp-section-title">${icon('shield-check')}<h2>Needs your approval</h2></div><span class="bp-attention">${pending().length} PENDING</span></div>${pending().length?`<div class="bp-table-wrap"><table class="bp-table"><thead><tr><th>Requester / secret</th><th>Purpose</th><th>Expires in</th><th><span aria-label="Actions"></span></th></tr></thead><tbody>${pending().map(r=>`<tr><td><strong>${r.agent}</strong><small class="bp-mono">${r.secret}</small></td><td>${r.purpose}</td><td>${tag(r.remaining,r.urgent?'bp-tag-wait':'bp-tag-neutral')}</td><td>${button('Review '+icon('arrow-up-right'),`data-review="${requests.indexOf(r)}" aria-label="Review ${r.agent}"`)}</td></tr>`).join('')}</tbody></table></div>`:empty('All caught up','No pending requests in these sample results.')}</section>`+
    `<div class="bp-bottom-grid"><section class="bp-section"><div class="bp-section-head"><h2>Recent activity</h2><button type="button" class="bp-button bp-button-quiet" data-page="audit">View log ${icon('arrow-up-right')}</button></div>${feed()}</section><section class="bp-section"><div class="bp-section-head"><h2>Exchange policy</h2><span class="bp-small bp-mono">v12</span></div><div class="bp-policy-body"><div class="bp-policy-line"><span>Registry entries</span><strong>4 secrets</strong></div><div class="bp-policy-line"><span>Configured rules</span><strong>3 require approval</strong></div><button type="button" class="bp-button bp-button-quiet" data-page="policy">Inspect the boundaries ${icon('arrow-right')}</button><div class="bp-boundary">${icon('lock-keyhole')}<span>Encrypted handoff. The recipient runtime decrypts the secret.</span></div></div></section></div>`;
  }
  function empty(title,description){return `<div class="bp-empty">${icon('check')}<h2>${title}</h2><p class="bp-small">${description}</p></div>`;}
  function approvals(){
    let r = requests[state.selected];
    if(state.decisions[r.id]) r=pending()[0];
    if(r) state.selected=requests.indexOf(r);
    return heading('Decisions / exchange requests','Approve with context.','A clear view of the requester, purpose, and secret before every decision.')+
    (!r?`<section class="bp-section">${empty('All caught up','Every sample request has a decision. View the audit log to review them.')}${button('View audit log','data-page="audit"')}</section>`:
    `<div class="bp-split"><div class="bp-queue"><div class="bp-queue-label">${pending().length} pending · expiry order</div>${pending().map(item=>`<button type="button" class="bp-request" data-review="${requests.indexOf(item)}" aria-pressed="${r===item}">${tag(item.urgent?'Expires soon':'Pending',item.urgent?'bp-tag-wait':'bp-tag-neutral')}<strong>${item.agent}</strong><small>${item.secret}</small><small style="margin-top:12px">${item.remaining} remaining</small></button>`).join('')}</div><section class="bp-detail"><div class="bp-detail-top"><span class="bp-kicker">Exchange approval</span>${tag(r.remaining+' left',r.urgent?'bp-tag-wait':'bp-tag-neutral')}</div><h2>${r.purpose}</h2><p>Requested by <span class="bp-lime">${r.agent}</span></p><dl class="bp-details"><div><dt>Requester</dt><dd class="bp-mono">${r.agent}</dd></div><div><dt>Secret name</dt><dd class="bp-mono">${r.secret}</dd></div><div><dt>Fulfiller</dt><dd class="bp-mono">${r.fulfiller}</dd></div><div><dt>Matched rule</dt><dd class="bp-mono">${r.rule}</dd></div><div><dt>Reference</dt><dd class="bp-mono">${r.id}</dd></div><div><dt>Requested</dt><dd>Sep 22, 2026 · ${r.time}</dd></div></dl><div class="bp-notice">${icon('info')}<span>This decision authorizes the exchange. It does not limit how the recipient uses a copied secret.</span></div><div class="bp-detail-actions">${button(icon('check')+' Approve exchange',`data-decision="approved" data-id="${r.id}"`,true)}${button('Reject',`data-decision="rejected" data-id="${r.id}"`)}</div><p class="bp-small" style="margin-top:13px">Preview actions update sample data only.</p></section></div>`);
  }
  function agentPage(){
    const shown=agents.filter(a=>state.agentFilter==='all'||(state.agentFilter==='active'?a!=='legacy-agent':a==='legacy-agent'));
    return heading('Identity / registered agents','Know who’s asking.','Manage agent enrollment and credentials across your workspace.',button(icon('plus')+' Enroll agent','data-enroll="true"',true))+
    `<div class="bp-toolbar" aria-label="Agent status">${['all','active','revoked'].map(v=>`<button type="button" class="bp-button" data-filter="${v}" aria-pressed="${state.agentFilter===v}">${v[0].toUpperCase()+v.slice(1)}${v==='all'?' · 7':v==='active'?' · 6':' · 1'}</button>`).join('')}</div><section class="bp-section"><div class="bp-table-wrap"><table class="bp-table"><thead><tr><th>Agent</th><th>Status</th><th>Enrolled</th><th>Credentials</th></tr></thead><tbody>${shown.map(a=>`<tr><td><strong>${a.replace('-',' ')}</strong><small class="bp-mono">${a}</small></td><td>${tag(a==='legacy-agent'?'Revoked':'Active',a==='legacy-agent'?'bp-tag-neutral':'')}</td><td>Sep ${a==='test-agent'?'22':'18'}, 2026</td><td>${button('Manage '+icon('arrow-up-right'),`data-agent="${a}"`)}</td></tr>`).join('')}</tbody></table></div></section><div class="bp-boundary">${icon('info')}<span>Active means enrolled and not revoked. It does not indicate that an agent is online.</span></div>`;
  }
  function policy(){return heading('Policy / version 12','Set the boundaries.','Review which exchanges require an operator decision.')+
    `<div class="bp-rules">${requests.map(r=>`<article class="bp-rule"><div class="bp-rule-head"><h2 class="bp-mono">${r.rule}</h2>${tag('Approval required','bp-tag-wait')}</div><div class="bp-rule-body"><div class="bp-small">Requester<strong class="bp-mono">${r.agent}</strong></div><div class="bp-small">Secret name<strong class="bp-mono">${r.secret}</strong></div><div class="bp-small">Allowed fulfiller<strong class="bp-mono">${r.fulfiller}</strong></div></div><div class="bp-boundary">Purpose: ${r.purpose}</div></article>`).join('')}</div><div class="bp-notice">${icon('lock-keyhole')}<span>Policy controls the exchange. A purpose label does not constrain downstream use of a delivered credential.</span></div>`;}
  function audit(){return heading('Audit / workspace activity','Every decision, in view.','Follow metadata for requests, approvals, and administration.')+
    `<section class="bp-section"><div class="bp-section-head"><h2>September 22, 2026</h2><span class="bp-small">Sample timeline</span></div>${feed(true)}</section><div class="bp-boundary">${icon('lock-keyhole')}<span>Metadata only. Secret values and bootstrap credentials do not belong in the audit view.</span></div>`;}
  function members(){return heading('Workspace / people','The people in control.','A consistent workspace view for roles and membership.')+`<section class="bp-section"><div class="bp-table-wrap"><table class="bp-table"><thead><tr><th>Member</th><th>Role</th><th>Status</th></tr></thead><tbody>${[['owner@example.test','Admin'],['operator@example.test','Operator'],['reviewer@example.test','Viewer']].map(([name,role])=>`<tr><td><strong>${name}</strong><small>Sample member</small></td><td>${role}</td><td>${tag('Active')}</td></tr>`).join('')}</tbody></table></div></section>`;}
  function usage(){return heading('Workspace / usage & billing','Room to keep working.','Understand consumption and workspace limits.')+`<section class="bp-section"><div class="bp-section-head"><h2>Current usage</h2><span class="bp-small">Sample allowances</span></div><div class="bp-policy-body">${[['Secret requests','128 / 1,000'],['Exchange requests','36 / 500'],['Agents','6 / 10'],['Members','3 / 5']].map(([a,b])=>`<div class="bp-policy-line"><span>${a}</span><strong class="bp-mono">${b}</strong></div>`).join('')}<div class="bp-boundary">Request quotas reset October 1, 2026.</div></div></section><div class="bp-notice">${icon('info')}<span>Billing and analytics will retain their current routes and entitlements. This preview proposes a shared workspace entry point; it introduces no pricing changes.</span></div>`;}
  function settingsPage(){return heading('Workspace / settings','Make it your workspace.','A quieter, consistent home for workspace administration.')+`<div class="bp-edit-grid"><section class="bp-section"><div class="bp-section-head"><h2>Workspace profile</h2></div><div class="bp-policy-body"><label class="bp-field">Display name<input value="Atas workspace" readonly></label><label class="bp-field">Workspace slug<input value="atas-demo" readonly></label><div class="bp-small">Profile fields are read-only in this preview.</div></div></section><section class="bp-section"><div class="bp-section-head"><h2>Account</h2></div><div class="bp-policy-body"><div class="bp-policy-line"><span>Role</span><strong>Administrator</strong></div><div class="bp-policy-line"><span>Language</span><strong>English</strong></div><div class="bp-boundary">Existing account, language, and password flows retain their behavior in the redesign.</div></div></section></div>`;}
  const views={overview,approvals,agents:agentPage,policy,audit,members,usage,settings:settingsPage};
  function render(){
    page.innerHTML=views[state.page]();
    root.querySelector('#bp-breadcrumb').textContent=titles[state.page];
    root.querySelector('#bp-nav-count').textContent=pending().length;
    root.querySelectorAll('.bp-nav button').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    const notice=root.querySelector('#bp-notification');notice.textContent=state.notice;notice.hidden=!state.notice;
    if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}});
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('bp-mobile-menu')){const open=root.dataset.menu!=='open';root.dataset.menu=open?'open':'closed';b.setAttribute('aria-expanded',String(open));return;}
    if(b.dataset.page){state.page=b.dataset.page;state.notice='';root.dataset.menu='closed';root.querySelector('.bp-mobile-menu').setAttribute('aria-expanded','false');render();return;}
    if(b.dataset.review!==undefined){state.selected=Number(b.dataset.review);state.page='approvals';state.notice='';render();return;}
    if(b.dataset.decision){state.decisions[b.dataset.id]=b.dataset.decision;state.notice=`Sample exchange ${b.dataset.decision}. The audit preview has been updated.`;render();return;}
    if(b.dataset.filter){state.agentFilter=b.dataset.filter;render();return;}
    if(b.dataset.agent){state.notice=`${b.dataset.agent}: credential management will keep the existing confirmation and one-time reveal flows. No credentials are present in this preview.`;render();return;}
    if(b.dataset.enroll){state.notice='Enrollment preview: enter an agent ID and optional display name. The implementation will retain the existing one-time bootstrap key reveal.';render();}
  });
  render();
  function applyDesign(){root.style.setProperty('--bp-radius',settings.corners+'px');root.style.setProperty('--bp-row',settings.density==='Compact'?'11px':'18px');}
  applyDesign();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(settings,'density',{label:'Table spacing',options:['Comfortable','Compact']});tweak.addSlider(settings,'corners',{label:'Corner radius',min:0,max:12,unit:'px'});}
})();
</script>
