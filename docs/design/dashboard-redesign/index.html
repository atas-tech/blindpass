  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap&quot;&gt;
&lt;style&gt;
#bp-dashboard{--bp-bg:#0b0e0d;--bp-panel:#101512;--bp-raised:#151b17;--bp-text:#f0f3ed;--bp-muted:#9ca59d;--bp-line:#27302a;--bp-line-strong:#5a6a60;--bp-lime:#c5f277;--bp-soft:#202b19;--bp-amber:#ebc17c;--bp-red:#f2a8a0;--bp-radius:6px;--bp-row:18px;color-scheme:dark;background:var(--bp-bg);color:var(--bp-text);font:400 14px/1.5 Inter,Arial,sans-serif;min-width:0;isolation:isolate}
#bp-dashboard *{box-sizing:border-box}
#bp-dashboard [hidden]{display:none!important}
#bp-dashboard h1,#bp-dashboard h2,#bp-dashboard h3,#bp-dashboard p{margin:0;color:inherit}
#bp-dashboard h1{font-size:32px;font-weight:500;line-height:1.18;letter-spacing:-1.4px}
#bp-dashboard h2{font-size:16px;font-weight:500;line-height:1.5;letter-spacing:-.3px}
#bp-dashboard h3{font-size:15px;font-weight:500;line-height:1.5}
#bp-dashboard button,#bp-dashboard input,#bp-dashboard select{font:inherit;color:inherit}
#bp-dashboard button{cursor:pointer;touch-action:manipulation}
#bp-dashboard button:disabled{cursor:default;opacity:.5}
#bp-dashboard button:focus-visible,#bp-dashboard input:focus-visible,#bp-dashboard select:focus-visible{outline:2px solid var(--bp-lime);outline-offset:3px}
#bp-dashboard svg{width:17px;height:17px;flex-shrink:0;stroke-width:1.6}
#bp-dashboard .bp-shell{display:grid;grid-template-columns:194px minmax(0,1fr);min-height:800px}
#bp-dashboard .bp-sidebar{background:var(--bp-panel);border-right:1px solid var(--bp-line);display:flex;flex-direction:column;padding:27px 15px 18px;gap:25px}
#bp-dashboard .bp-brand{display:flex;align-items:center;gap:9px;font-size:23px;line-height:1;letter-spacing:-1px;font-weight:500;padding:0 8px}
#bp-dashboard .bp-brand em{color:var(--bp-lime);font-style:normal}
#bp-dashboard .bp-mark{width:23px;height:25px;display:grid;grid-template-columns:1fr 1fr;gap:4px;transform:skewY(-9deg);flex-shrink:0}
#bp-dashboard .bp-mark i{background:var(--bp-lime);display:block}
#bp-dashboard .bp-mark i:nth-child(1){border-radius:3px 0 0 0}#bp-dashboard .bp-mark i:nth-child(2){border-radius:0 5px 0 0;opacity:.7}#bp-dashboard .bp-mark i:nth-child(3){border-radius:0 0 0 3px;opacity:.7}#bp-dashboard .bp-mark i:nth-child(4){border-radius:0 0 5px 0}
#bp-dashboard .bp-workspace{border:1px solid var(--bp-line);border-radius:var(--bp-radius);padding:12px;display:flex;gap:10px;align-items:center}
#bp-dashboard .bp-avatar{height:31px;width:31px;background:var(--bp-raised);border:1px solid var(--bp-line);border-radius:5px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
#bp-dashboard .bp-workspace strong{font-weight:500;font-size:12px;display:block}
#bp-dashboard .bp-small{font-size:12px;line-height:1.6;color:var(--bp-muted)}
#bp-dashboard .bp-kicker{font:400 11px/1.6 Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:1.1px;text-transform:uppercase;color:var(--bp-muted)}
#bp-dashboard .bp-nav-group&gt;.bp-kicker{padding:0 10px;margin-bottom:9px}
#bp-dashboard .bp-nav{display:flex;flex-direction:column;gap:5px}
#bp-dashboard .bp-nav button{display:flex;align-items:center;gap:10px;text-align:left;min-height:39px;border:1px solid transparent;border-radius:4px;background:transparent;padding:8px 10px;font-size:12px;color:var(--bp-muted);width:100%}
#bp-dashboard .bp-nav button:hover{background:var(--bp-raised);color:var(--bp-text)}
#bp-dashboard .bp-nav button[aria-current=&quot;page&quot;]{color:var(--bp-lime);background:var(--bp-soft);border-color:#354326}
#bp-dashboard .bp-counter{margin-left:auto;border-radius:3px;padding:0 6px;background:var(--bp-raised);font:400 11px/20px Consolas,monospace;color:var(--bp-lime)}
#bp-dashboard .bp-sidebar-bottom{margin-top:auto;border-top:1px solid var(--bp-line);padding:17px 6px 0;display:flex;gap:10px;align-items:center}
#bp-dashboard .bp-main{min-width:0}
#bp-dashboard .bp-topbar{height:65px;border-bottom:1px solid var(--bp-line);padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}
#bp-dashboard .bp-crumb{display:flex;align-items:center;gap:12px;color:var(--bp-muted);font-size:12px}
#bp-dashboard .bp-crumb span:last-child{color:var(--bp-text)}
#bp-dashboard .bp-demo{font:400 11px/1.4 Consolas,monospace;letter-spacing:.8px;border:1px solid var(--bp-line);padding:5px 7px;color:var(--bp-muted);white-space:nowrap}
#bp-dashboard .bp-button.bp-mobile-menu{display:none}
#bp-dashboard .bp-content{padding:31px 30px 24px}
#bp-dashboard .bp-page-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:27px}
#bp-dashboard .bp-page-heading .bp-kicker{color:var(--bp-lime);margin-bottom:10px}
#bp-dashboard .bp-page-heading p{color:var(--bp-muted);font-size:12px;margin-top:10px;max-width:490px}
#bp-dashboard .bp-lime{color:var(--bp-lime)}
#bp-dashboard .bp-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--bp-line-strong);background:var(--bp-panel);border-radius:4px;min-height:36px;padding:8px 12px;font-size:12px;white-space:nowrap}
#bp-dashboard .bp-button:hover{background:var(--bp-raised);border-color:#526048}
#bp-dashboard .bp-button-primary{color:var(--bp-bg);background:var(--bp-lime);border-color:var(--bp-lime)}
#bp-dashboard .bp-button-primary:hover{background:#d2f69a;border-color:#d2f69a}
#bp-dashboard .bp-button-quiet{background:transparent;border:0;padding:5px 0;color:var(--bp-muted);min-height:30px}
#bp-dashboard .bp-button-quiet:hover{color:var(--bp-lime);background:transparent}
#bp-dashboard .bp-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--bp-line);border-radius:var(--bp-radius);background:var(--bp-panel);margin-bottom:25px}
#bp-dashboard .bp-metric{padding:18px 20px;min-width:0;border-right:1px solid var(--bp-line)}
#bp-dashboard .bp-metric:last-child{border-right:0}
#bp-dashboard .bp-metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--bp-muted);gap:8px;font-size:12px}
#bp-dashboard .bp-value{font-size:31px;letter-spacing:-1.2px;line-height:1.2;font-weight:500;margin:12px 0 7px;font-variant-numeric:tabular-nums}
#bp-dashboard .bp-value span{font-size:13px;color:var(--bp-muted);letter-spacing:0;font-weight:400}
#bp-dashboard .bp-meter{height:3px;background:var(--bp-line);margin-top:13px}
#bp-dashboard .bp-meter i{display:block;height:100%;width:12.8%;background:var(--bp-lime)}
#bp-dashboard .bp-section{border:1px solid var(--bp-line);background:var(--bp-panel);border-radius:var(--bp-radius);min-width:0;overflow:hidden}
#bp-dashboard .bp-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 19px;border-bottom:1px solid var(--bp-line)}
#bp-dashboard .bp-section-title{display:flex;align-items:center;gap:10px;min-width:0}
#bp-dashboard .bp-section-title&gt;svg{color:var(--bp-lime)}
#bp-dashboard .bp-attention{font:400 11px/1.4 Consolas,monospace;color:var(--bp-amber)}
#bp-dashboard .bp-table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;background:transparent}
#bp-dashboard .bp-table th{font-weight:400;color:var(--bp-muted);font-size:11px;text-transform:uppercase;letter-spacing:.65px;background:var(--bp-raised);padding:10px 18px}
#bp-dashboard .bp-table td{padding:var(--bp-row) 18px;border-top:1px solid var(--bp-line);vertical-align:middle;overflow-wrap:anywhere}
#bp-dashboard .bp-table strong{font-weight:500;display:block}
#bp-dashboard .bp-table small{display:block;color:var(--bp-muted);font-size:11px;margin-top:3px}
#bp-dashboard .bp-table .bp-button{min-height:30px;padding:5px 9px;font-size:11px}
#bp-dashboard .bp-mono{font-family:Consolas,&quot;Liberation Mono&quot;,monospace;font-size:11px;overflow-wrap:anywhere}
#bp-dashboard .bp-table-wrap{overflow-x:auto}
#bp-dashboard .bp-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:3px;background:var(--bp-soft);color:var(--bp-lime);font-size:11px;line-height:1.5;white-space:nowrap}
#bp-dashboard .bp-tag-wait{background:#2c2419;color:var(--bp-amber)}
#bp-dashboard .bp-tag-neutral{background:var(--bp-raised);color:var(--bp-muted)}
#bp-dashboard .bp-tag-red{background:#2a1f1d;color:var(--bp-red)}
#bp-dashboard .bp-tag svg{width:11px;height:11px}
#bp-dashboard .bp-bottom-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:24px}
#bp-dashboard .bp-feed{list-style:none;padding:0 19px;margin:0}
#bp-dashboard .bp-feed li{display:grid;grid-template-columns:19px minmax(0,1fr) auto;gap:11px;align-items:start;padding:16px 0;border-bottom:1px solid var(--bp-line);font-size:12px}
#bp-dashboard .bp-feed li:last-child{border:0}
#bp-dashboard .bp-feed svg{color:var(--bp-muted);margin-top:2px}
#bp-dashboard .bp-feed small{display:block;color:var(--bp-muted);font-size:11px;margin-top:3px}
#bp-dashboard .bp-feed time{color:var(--bp-muted);font:400 11px/1.8 Consolas,monospace}
#bp-dashboard .bp-policy-body{padding:19px}
#bp-dashboard .bp-policy-line{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:14px}
#bp-dashboard .bp-policy-line span{color:var(--bp-muted)}
#bp-dashboard .bp-policy-line strong{font-weight:400;text-align:right}
#bp-dashboard .bp-boundary{display:flex;gap:9px;color:var(--bp-muted);font-size:11px;line-height:1.7;border-top:1px solid var(--bp-line);padding-top:13px;margin-top:17px}
#bp-dashboard .bp-boundary svg{color:var(--bp-lime);margin-top:2px}
#bp-dashboard .bp-footer{margin-top:24px;display:flex;justify-content:space-between;gap:15px;color:var(--bp-muted);font:400 11px/1.5 Consolas,monospace}
#bp-dashboard .bp-split{display:grid;grid-template-columns:245px minmax(0,1fr);border:1px solid var(--bp-line);border-radius:var(--bp-radius);background:var(--bp-panel);overflow:hidden}
#bp-dashboard .bp-queue{border-right:1px solid var(--bp-line);padding:10px}
#bp-dashboard .bp-queue-label{padding:7px 8px 16px;color:var(--bp-muted);font-size:11px}
#bp-dashboard .bp-request{display:block;width:100%;text-align:left;padding:16px 12px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--bp-muted);margin-bottom:5px}
#bp-dashboard .bp-request[aria-pressed=&quot;true&quot;]{background:var(--bp-raised);border-color:#48533c;color:var(--bp-text)}
#bp-dashboard .bp-request strong{display:block;font-size:12px;font-weight:500;margin:10px 0 4px}
#bp-dashboard .bp-request small{font-size:11px;color:var(--bp-muted);display:block;overflow-wrap:anywhere}
#bp-dashboard .bp-detail{padding:24px;min-width:0}
#bp-dashboard .bp-detail-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:22px}
#bp-dashboard .bp-detail h2{font-size:22px;line-height:1.35;letter-spacing:-.6px}
#bp-dashboard .bp-detail&gt;p{font-size:12px;color:var(--bp-muted);margin-top:9px}
#bp-dashboard .bp-details{margin:21px 0 0}
#bp-dashboard .bp-details&gt;div{display:grid;grid-template-columns:105px minmax(0,1fr);gap:14px;padding:13px 0;border-bottom:1px solid var(--bp-line);font-size:12px}
#bp-dashboard .bp-details dt{color:var(--bp-muted)}
#bp-dashboard .bp-details dd{margin:0;overflow-wrap:anywhere}
#bp-dashboard .bp-detail-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}
#bp-dashboard .bp-notice{background:var(--bp-raised);border:1px solid var(--bp-line);border-radius:4px;display:flex;gap:10px;padding:14px;margin-top:19px;color:var(--bp-muted);font-size:11px;line-height:1.7}
#bp-dashboard .bp-notice svg{color:var(--bp-lime);margin-top:2px}
#bp-dashboard .bp-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:17px}
#bp-dashboard .bp-toolbar button[aria-pressed=&quot;true&quot;]{color:var(--bp-lime);border-color:#48533c;background:var(--bp-soft)}
#bp-dashboard .bp-empty{padding:45px 24px;text-align:center;color:var(--bp-muted)}
#bp-dashboard .bp-empty svg{width:25px;height:25px;color:var(--bp-lime);margin:0 auto 12px;display:block}
#bp-dashboard .bp-empty h2{color:var(--bp-text);margin-bottom:7px}
#bp-dashboard .bp-live{color:var(--bp-lime);font-size:12px;margin:0 0 18px}
#bp-dashboard .bp-edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
#bp-dashboard .bp-field{display:flex;flex-direction:column;gap:7px;font-size:12px;color:var(--bp-muted);margin:15px 0}
#bp-dashboard .bp-field input,#bp-dashboard .bp-field select{border:1px solid var(--bp-line-strong);border-radius:4px;background:var(--bp-bg);padding:10px 12px;min-width:0;width:100%;color:var(--bp-text)}
#bp-dashboard .bp-rules{display:flex;flex-direction:column;gap:15px}

&lt;div id=&quot;bp-dashboard&quot; aria-label=&quot;BlindPass dashboard redesign&quot;&gt;
  &lt;div class=&quot;bp-shell&quot;&gt;
    &lt;aside class=&quot;bp-sidebar&quot;&gt;
      &lt;div class=&quot;bp-brand&quot;&gt;&lt;span class=&quot;bp-mark&quot; aria-hidden=&quot;true&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/span&gt;&lt;span&gt;blindpass&lt;em&gt;.&lt;/em&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;bp-workspace&quot;&gt;&lt;span class=&quot;bp-avatar&quot;&gt;AT&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Atas workspace&lt;/strong&gt;&lt;span class=&quot;bp-small&quot;&gt;Admin access&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

        &lt;button type=&quot;button&quot; data-page=&quot;approvals&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Approvals&lt;span class=&quot;bp-counter&quot; id=&quot;bp-nav-count&quot;&gt;3&lt;/span&gt;&lt;/button&gt;
        &lt;button type=&quot;button&quot; data-page=&quot;agents&quot;&gt;&lt;i data-lucide=&quot;bot&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Agents&lt;/button&gt;

      &lt;/nav&gt;&lt;/div&gt;
      &lt;div class=&quot;bp-nav-group&quot;&gt;&lt;p class=&quot;bp-kicker&quot;&gt;Workspace&lt;/p&gt;&lt;nav class=&quot;bp-nav&quot; aria-label=&quot;Workspace&quot;&gt;
        &lt;button type=&quot;button&quot; data-page=&quot;members&quot;&gt;&lt;i data-lucide=&quot;users&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Members&lt;/button&gt;
        &lt;button type=&quot;button&quot; data-page=&quot;usage&quot;&gt;&lt;i data-lucide=&quot;chart-no-axes-combined&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Usage &amp; billing&lt;/button&gt;
        &lt;button type=&quot;button&quot; data-page=&quot;settings&quot;&gt;&lt;i data-lucide=&quot;settings-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;Settings&lt;/button&gt;
      &lt;/nav&gt;&lt;/div&gt;
      &lt;div class=&quot;bp-sidebar-bottom&quot;&gt;&lt;span class=&quot;bp-avatar&quot;&gt;OP&lt;/span&gt;&lt;div&gt;&lt;div style=&quot;font-size:12px&quot;&gt;Demo operator&lt;/div&gt;&lt;div class=&quot;bp-small&quot;&gt;Administrator&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;bp-main&quot;&gt;
      &lt;header class=&quot;bp-topbar&quot;&gt;&lt;div class=&quot;bp-crumb&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;bp-button bp-mobile-menu&quot; aria-label=&quot;Toggle navigation&quot; aria-expanded=&quot;false&quot;&gt;&lt;i data-lucide=&quot;menu&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;span&gt;Workspace&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;/&lt;/span&gt;&lt;span id=&quot;bp-breadcrumb&quot;&gt;Overview&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;bp-demo&quot;&gt;DESIGN PREVIEW · SAMPLE DATA&lt;/span&gt;&lt;/header&gt;
      &lt;main class=&quot;bp-content&quot;&gt;&lt;div id=&quot;bp-notification&quot; class=&quot;bp-live&quot; role=&quot;status&quot; aria-live=&quot;polite&quot; hidden&gt;&lt;/div&gt;&lt;div id=&quot;bp-page&quot;&gt;&lt;/div&gt;&lt;footer class=&quot;bp-footer&quot;&gt;&lt;span&gt;blindpass / encrypted provisioning&lt;/span&gt;&lt;span&gt;Autonomy, with boundaries.&lt;/span&gt;&lt;/footer&gt;&lt;/main&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;bp-dashboard&#x27;);
  const page = root.querySelector(&#x27;#bp-page&#x27;);
  const settings = {density:&#x27;Comfortable&#x27;,corners:6};
  const state = {page:&#x27;overview&#x27;,selected:0,agentFilter:&#x27;all&#x27;,notice:&#x27;&#x27;,decisions:{}};
  const requests = [
    {id:&#x27;apr_demo_001&#x27;,agent:&#x27;release-agent&#x27;,name:&#x27;Release agent&#x27;,secret:&#x27;staging_api_key&#x27;,purpose:&#x27;Validate a staging release&#x27;,fulfiller:&#x27;ops-agent&#x27;,rule:&#x27;staging-release-review&#x27;,remaining:&#x27;1m 42s&#x27;,time:&#x27;09:32&#x27;,urgent:true},
    {id:&#x27;apr_demo_002&#x27;,agent:&#x27;support-agent&#x27;,name:&#x27;Support agent&#x27;,secret:&#x27;support_api_token&#x27;,purpose:&#x27;Fetch a support case summary&#x27;,fulfiller:&#x27;ops-agent&#x27;,rule:&#x27;support-review&#x27;,remaining:&#x27;6m 18s&#x27;,time:&#x27;09:37&#x27;,urgent:false},
    {id:&#x27;apr_demo_003&#x27;,agent:&#x27;report-agent&#x27;,name:&#x27;Report agent&#x27;,secret:&#x27;reports_api_key&#x27;,purpose:&#x27;Compile the daily report&#x27;,fulfiller:&#x27;ops-agent&#x27;,rule:&#x27;reports-review&#x27;,remaining:&#x27;8m 05s&#x27;,time:&#x27;09:39&#x27;,urgent:false}
  ];
  const agents = [&#x27;release-agent&#x27;,&#x27;support-agent&#x27;,&#x27;report-agent&#x27;,&#x27;ops-agent&#x27;,&#x27;docs-agent&#x27;,&#x27;test-agent&#x27;,&#x27;legacy-agent&#x27;];
  const pending = () =&gt; requests.filter(r =&gt; !state.decisions[r.id]);
  const icon = name =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
  const tag = (text,kind=&#x27;&#x27;) =&gt; `&lt;span class=&quot;bp-tag ${kind}&quot;&gt;${text}&lt;/span&gt;`;
  const button = (text,action,primary=false) =&gt; `&lt;button type=&quot;button&quot; class=&quot;bp-button ${primary?&#x27;bp-button-primary&#x27;:&#x27;&#x27;}&quot; ${action}&gt;${text}&lt;/button&gt;`;
  const heading = (kicker,title,sub,action=&#x27;&#x27;) =&gt; `&lt;div class=&quot;bp-page-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;bp-kicker&quot;&gt;${kicker}&lt;/div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p&gt;${sub}&lt;/p&gt;&lt;/div&gt;${action}&lt;/div&gt;`;
  const titles = {overview:&#x27;Overview&#x27;,approvals:&#x27;Approvals&#x27;,agents:&#x27;Agents&#x27;,policy:&#x27;Exchange policy&#x27;,audit:&#x27;Audit log&#x27;,members:&#x27;Members&#x27;,usage:&#x27;Usage &amp; billing&#x27;,settings:&#x27;Settings&#x27;};
  function feed(full=false) {
    const actions = requests.filter(r =&gt; state.decisions[r.id]).map(r =&gt; ({name:`Exchange ${state.decisions[r.id]}`,meta:r.agent,time:&#x27;Now&#x27;,icon:state.decisions[r.id]===&#x27;approved&#x27;?&#x27;check&#x27;:&#x27;x&#x27;}));
    const events = [...actions,{name:&#x27;Exchange completed&#x27;,meta:&#x27;docs-agent · docs_api_key&#x27;,time:&#x27;09:38&#x27;,icon:&#x27;arrow-left-right&#x27;},{name:&#x27;Agent enrolled&#x27;,meta:&#x27;test-agent · demo operator&#x27;,time:&#x27;09:25&#x27;,icon:&#x27;bot&#x27;},{name:&#x27;Policy updated&#x27;,meta:&#x27;Version 12 · demo operator&#x27;,time:&#x27;09:14&#x27;,icon:&#x27;sliders-horizontal&#x27;}];
    if(full){events.push(...requests.map(r=&gt;({name:&#x27;Approval requested&#x27;,meta:r.agent+&#x27; · &#x27;+r.id,time:r.time,icon:&#x27;shield-check&#x27;})));events.sort((a,b)=&gt;(b.time===&#x27;Now&#x27;?&#x27;99:99&#x27;:b.time).localeCompare(a.time===&#x27;Now&#x27;?&#x27;99:99&#x27;:a.time));}
    return `&lt;ul class=&quot;bp-feed&quot;&gt;${events.slice(0,full?12:3).map(e=&gt;`&lt;li&gt;${icon(e.icon)}&lt;div&gt;${e.name}&lt;small&gt;${e.meta}&lt;/small&gt;&lt;/div&gt;&lt;time&gt;${e.time}&lt;/time&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ul&gt;`;
  }
  function overview() {
    return heading(&#x27;Your workspace, at a glance&#x27;,&#x27;Access, &lt;span class=&quot;bp-lime&quot;&gt;under control.&lt;/span&gt;&#x27;,&#x27;Review requests. Set the boundaries. Keep work moving.&#x27;,button(&#x27;Review approvals &#x27;+icon(&#x27;arrow-right&#x27;),&#x27;data-page=&quot;approvals&quot;&#x27;,true))+
    `&lt;div class=&quot;bp-metrics&quot;&gt;&lt;div class=&quot;bp-metric&quot;&gt;&lt;div class=&quot;bp-metric-top&quot;&gt;Active agents${icon(&#x27;bot&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-value&quot;&gt;6 &lt;span&gt;/ 10&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-small&quot;&gt;Enrolled in this workspace&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-metric&quot;&gt;&lt;div class=&quot;bp-metric-top&quot;&gt;Pending in latest results${icon(&#x27;shield-check&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-value&quot;&gt;${pending().length.toString().padStart(2,&#x27;0&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-small&quot;&gt;${pending().some(r=&gt;r.urgent)?&#x27;&lt;span style=&quot;color:var(--bp-amber)&quot;&gt;1 expires in under 2 minutes&lt;/span&gt;&#x27;:&#x27;Review the remaining requests&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;bp-metric&quot;&gt;&lt;div class=&quot;bp-metric-top&quot;&gt;Secret requests${icon(&#x27;arrow-left-right&#x27;)}&lt;/div&gt;&lt;div class=&quot;bp-value&quot;&gt;128 &lt;span&gt;/ 1,000&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-small&quot;&gt;This month · resets Oct 1&lt;/div&gt;&lt;div class=&quot;bp-meter&quot; role=&quot;meter&quot; aria-label=&quot;Monthly secret requests&quot; aria-valuenow=&quot;128&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;1000&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`+
    `&lt;section class=&quot;bp-section&quot;&gt;&lt;div class=&quot;bp-section-head&quot;&gt;&lt;div class=&quot;bp-section-title&quot;&gt;${icon(&#x27;shield-check&#x27;)}&lt;h2&gt;Needs your approval&lt;/h2&gt;&lt;/div&gt;&lt;span class=&quot;bp-attention&quot;&gt;${pending().length} PENDING&lt;/span&gt;&lt;/div&gt;${pending().length?`&lt;div class=&quot;bp-table-wrap&quot;&gt;&lt;table class=&quot;bp-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Requester / secret&lt;/th&gt;&lt;th&gt;Purpose&lt;/th&gt;&lt;th&gt;Expires in&lt;/th&gt;&lt;th&gt;&lt;span aria-label=&quot;Actions&quot;&gt;&lt;/span&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${pending().map(r=&gt;`&lt;tr&gt;&lt;td&gt;&lt;strong&gt;${r.agent}&lt;/strong&gt;&lt;small class=&quot;bp-mono&quot;&gt;${r.secret}&lt;/small&gt;&lt;/td&gt;&lt;td&gt;${r.purpose}&lt;/td&gt;&lt;td&gt;${tag(r.remaining,r.urgent?&#x27;bp-tag-wait&#x27;:&#x27;bp-tag-neutral&#x27;)}&lt;/td&gt;&lt;td&gt;${button(&#x27;Review &#x27;+icon(&#x27;arrow-up-right&#x27;),`data-review=&quot;${requests.indexOf(r)}&quot; aria-label=&quot;Review ${r.agent}&quot;`)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`:empty(&#x27;All caught up&#x27;,&#x27;No pending requests in these sample results.&#x27;)}&lt;/section&gt;`+
    `&lt;div class=&quot;bp-bottom-grid&quot;&gt;&lt;section class=&quot;bp-section&quot;&gt;&lt;div class=&quot;bp-section-head&quot;&gt;&lt;h2&gt;Recent activity&lt;/h2&gt;&lt;button type=&quot;button&quot; class=&quot;bp-button bp-button-quiet&quot; data-page=&quot;audit&quot;&gt;View log ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/div&gt;${feed()}&lt;/section&gt;&lt;section class=&quot;bp-section&quot;&gt;&lt;div class=&quot;bp-section-head&quot;&gt;&lt;h2&gt;Exchange policy&lt;/h2&gt;&lt;span class=&quot;bp-small bp-mono&quot;&gt;v12&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-policy-body&quot;&gt;&lt;div class=&quot;bp-policy-line&quot;&gt;&lt;span&gt;Registry entries&lt;/span&gt;&lt;strong&gt;4 secrets&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;bp-policy-line&quot;&gt;&lt;span&gt;Configured rules&lt;/span&gt;&lt;strong&gt;3 require approval&lt;/strong&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;bp-button bp-button-quiet&quot; data-page=&quot;policy&quot;&gt;Inspect the boundaries ${icon(&#x27;arrow-right&#x27;)}&lt;/button&gt;&lt;div class=&quot;bp-boundary&quot;&gt;${icon(&#x27;lock-keyhole&#x27;)}&lt;span&gt;Encrypted handoff. The recipient runtime decrypts the secret.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`;
  }
  function empty(title,description){return `&lt;div class=&quot;bp-empty&quot;&gt;${icon(&#x27;check&#x27;)}&lt;h2&gt;${title}&lt;/h2&gt;&lt;p class=&quot;bp-small&quot;&gt;${description}&lt;/p&gt;&lt;/div&gt;`;}
  function approvals(){
    let r = requests[state.selected];
    if(state.decisions[r.id]) r=pending()[0];
    if(r) state.selected=requests.indexOf(r);
    return heading(&#x27;Decisions / exchange requests&#x27;,&#x27;Approve with context.&#x27;,&#x27;A clear view of the requester, purpose, and secret before every decision.&#x27;)+
    (!r?`&lt;section class=&quot;bp-section&quot;&gt;${empty(&#x27;All caught up&#x27;,&#x27;Every sample request has a decision. View the audit log to review them.&#x27;)}${button(&#x27;View audit log&#x27;,&#x27;data-page=&quot;audit&quot;&#x27;)}&lt;/section&gt;`:
    `&lt;div class=&quot;bp-split&quot;&gt;&lt;div class=&quot;bp-queue&quot;&gt;&lt;div class=&quot;bp-queue-label&quot;&gt;${pending().length} pending · expiry order&lt;/div&gt;${pending().map(item=&gt;`&lt;button type=&quot;button&quot; class=&quot;bp-request&quot; data-review=&quot;${requests.indexOf(item)}&quot; aria-pressed=&quot;${r===item}&quot;&gt;${tag(item.urgent?&#x27;Expires soon&#x27;:&#x27;Pending&#x27;,item.urgent?&#x27;bp-tag-wait&#x27;:&#x27;bp-tag-neutral&#x27;)}&lt;strong&gt;${item.agent}&lt;/strong&gt;&lt;small&gt;${item.secret}&lt;/small&gt;&lt;small style=&quot;margin-top:12px&quot;&gt;${item.remaining} remaining&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;section class=&quot;bp-detail&quot;&gt;&lt;div class=&quot;bp-detail-top&quot;&gt;&lt;span class=&quot;bp-kicker&quot;&gt;Exchange approval&lt;/span&gt;${tag(r.remaining+&#x27; left&#x27;,r.urgent?&#x27;bp-tag-wait&#x27;:&#x27;bp-tag-neutral&#x27;)}&lt;/div&gt;&lt;h2&gt;${r.purpose}&lt;/h2&gt;&lt;p&gt;Requested by &lt;span class=&quot;bp-lime&quot;&gt;${r.agent}&lt;/span&gt;&lt;/p&gt;&lt;dl class=&quot;bp-details&quot;&gt;&lt;div&gt;&lt;dt&gt;Requester&lt;/dt&gt;&lt;dd class=&quot;bp-mono&quot;&gt;${r.agent}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Secret name&lt;/dt&gt;&lt;dd class=&quot;bp-mono&quot;&gt;${r.secret}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Fulfiller&lt;/dt&gt;&lt;dd class=&quot;bp-mono&quot;&gt;${r.fulfiller}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Matched rule&lt;/dt&gt;&lt;dd class=&quot;bp-mono&quot;&gt;${r.rule}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Reference&lt;/dt&gt;&lt;dd class=&quot;bp-mono&quot;&gt;${r.id}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Requested&lt;/dt&gt;&lt;dd&gt;Sep 22, 2026 · ${r.time}&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;bp-notice&quot;&gt;${icon(&#x27;info&#x27;)}&lt;span&gt;This decision authorizes the exchange. It does not limit how the recipient uses a copied secret.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bp-detail-actions&quot;&gt;${button(icon(&#x27;check&#x27;)+&#x27; Approve exchange&#x27;,`data-decision=&quot;approved&quot; data-id=&quot;${r.id}&quot;`,true)}${button(&#x27;Reject&#x27;,`data-decision=&quot;rejected&quot; data-id=&quot;${r.id}&quot;`)}&lt;/div&gt;&lt;p class=&quot;bp-small&quot; style=&quot;margin-top:13px&quot;&gt;Preview actions update sample data only.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;`);
  }
  function agentPage(){
