        "responses": { "200": { "description": "Approval decision recorded", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ApprovalDecision" } } } }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" }, "409": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/approvals/{reference}/reject": {
      "post": {
