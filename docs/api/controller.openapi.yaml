{
  "openapi": "3.1.0",
  "info": {
    "title": "BlindPass Local Controller API",
    "version": "0.1.0",
    "description": "P02 controller contract. This file uses JSON-compatible YAML 1.2 syntax so the checked-in type generator can use Node's standard library without installing a YAML parser.",
    "x-blindpass-ct19": "adopted",
    "x-blindpass-legacy-route-count": 12
  },
  "servers": [
    { "url": "http://127.0.0.1:3200", "description": "Local controller" }
  ],
  "tags": [
    { "name": "Health" },
    { "name": "Compatibility" },
    { "name": "Capabilities" },
    { "name": "Local administration" }
  ],
  "paths": {
    "/healthz": {
      "get": {
        "operationId": "healthz",
        "tags": ["Health"],
        "summary": "Check process liveness",
        "responses": {
          "200": { "description": "The controller process is alive", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HealthResponse" } } } }
        }
      }
    },
    "/readyz": {
      "get": {
        "operationId": "readyz",
        "tags": ["Health"],
        "summary": "Check configured persistence readiness",
        "responses": {
          "200": { "description": "The configured store is ready", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReadinessResponse" } } } },
          "503": { "description": "The configured store is unavailable", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReadinessResponse" } } } }
        }
      }
    },
    "/api/v2/agents/token": {
      "post": {
        "operationId": "mintAgentToken",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Exchange an agent bootstrap key for a short-lived agent token",
        "description": "Accepts the bootstrap key as a Bearer credential or in x-agent-api-key. Keys are hashed at rest and invalidated on rotation or revocation. The retained IP rate limit defaults to five requests per minute; hosted paid-tier quota behavior is excluded.",
        "security": [{ "agentBearer": [] }, { "agentApiKey": [] }],
        "responses": {
          "200": { "description": "Agent token minted", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentTokenResponse" } } } },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "429": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/request": {
      "post": {
        "operationId": "createSecretRequest",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Create a human-to-agent secret request",
        "description": "The response carries separate signed metadata and submit scopes in secret_url. The controller never receives plaintext.",
        "security": [{ "agentBearer": [] }, { "externalWorkloadBearer": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SecretRequestInput" } } } },
        "responses": {
          "201": { "description": "Secret request created", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SecretRequestCreated" } } } },
          "400": { "$ref": "#/components/responses/LegacyError" },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "404": { "$ref": "#/components/responses/LegacyError" },
          "429": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/metadata/{id}": {
      "get": {
        "operationId": "getSecretMetadata",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Read browser metadata using the metadata signature",
        "security": [{ "browserSignedLink": [] }],
        "parameters": [
          { "in": "path", "name": "id", "required": true, "schema": { "type": "string" } },
          { "in": "query", "name": "sig", "required": true, "schema": { "type": "string" } }
        ],
        "responses": {
          "200": { "description": "Public-key metadata only", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SecretMetadata" } } } },
          "403": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/submit/{id}": {
      "post": {
        "operationId": "submitSecret",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Submit an encrypted secret using the submit signature",
        "security": [{ "browserSignedLink": [] }],
        "parameters": [
          { "in": "path", "name": "id", "required": true, "schema": { "type": "string" } },
          { "in": "query", "name": "sig", "required": true, "schema": { "type": "string" } }
        ],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EncryptedPayload" } } } },
        "responses": {
          "201": { "description": "Encrypted payload accepted; the payload is not echoed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SubmittedResponse" } } } },
          "400": { "$ref": "#/components/responses/LegacyError" },
          "403": { "$ref": "#/components/responses/LegacyError" },
          "409": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" },
          "413": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/status/{id}": {
      "get": {
        "operationId": "getSecretStatus",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Read secret status using the owning agent token",
        "security": [{ "agentBearer": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }],
        "responses": {
          "200": { "description": "Only pending or submitted is returned", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SecretStatus" } } } },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "410": { "description": "Unknown, foreign, consumed, or expired request", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExpiredStatus" } } } }
        }
      }
    },
    "/api/v2/secret/browser-status/{id}/capability": {
      "post": {
        "operationId": "issueBrowserStatusCapability",
        "tags": ["Compatibility"],
        "summary": "Exchange the metadata signature for a status-only capability",
        "description": "Issuance is idempotent for the same live metadata signature while the request deadline is unchanged. The capability expires no later than that signature or the request deadline; a retry after submission is clamped to the shorter submitted deadline, and retries never extend authority. It cannot submit, retrieve, or call the agent-authenticated status route.",
        "security": [{ "browserSignedLink": [] }],
        "parameters": [
          { "in": "path", "name": "id", "required": true, "schema": { "type": "string" } },
          { "in": "query", "name": "sig", "required": true, "schema": { "type": "string" }, "description": "The original metadata-scoped exp.sig credential" }
        ],
        "responses": {
          "200": { "description": "Status-only signature bound to the same request and no later than the source expiry", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BrowserStatusCapabilityResponse" } } } },
          "410": { "description": "Missing, invalid, wrong-scope, unknown or expired source capability", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExpiredStatus" } } } }
        }
      }
    },
    "/api/v2/secret/browser-status/{id}": {
      "get": {
        "operationId": "getBrowserAuthorizedSecretStatus",
        "tags": ["Compatibility"],
        "summary": "Read pending or submitted using the separate status-only signature",
        "description": "Returns no request metadata, key, ciphertext or identity. Unknown, consumed, expired, invalid, foreign-request and wrong-scope credentials return 410 with {status: expired}. Reads do not consume the request.",
        "security": [{ "browserSignedLink": [] }],
        "parameters": [
          { "in": "path", "name": "id", "required": true, "schema": { "type": "string" } },
          { "in": "query", "name": "sig", "required": true, "schema": { "type": "string" }, "description": "The status-scoped exp.sig credential" }
        ],
        "responses": {
          "200": { "description": "Minimal browser-authorized request status", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SecretStatus" } } } },
          "410": { "description": "Unknown, consumed, expired, invalid, foreign or wrong-scope capability", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExpiredStatus" } } } }
        }
      }
    },
    "/api/v2/secret/retrieve/{id}": {
      "get": {
        "operationId": "retrieveSecret",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Retrieve and consume an encrypted secret once",
        "security": [{ "agentBearer": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }],
        "responses": {
          "200": { "description": "Encrypted payload for the owning agent", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EncryptedPayload" } } } },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "409": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/exchange/request": {
      "post": {
        "operationId": "createExchangeRequest",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Request an agent-to-agent secret exchange",
        "security": [{ "agentBearer": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExchangeRequestInput" } } } },
        "responses": {
          "201": { "description": "Exchange created or awaiting approval", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExchangeRequestCreated" } } } },
          "400": { "$ref": "#/components/responses/LegacyError" },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "403": { "description": "Policy denial or pending approval; no exchange is created", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExchangePolicyDenial" } } } },
          "409": { "$ref": "#/components/responses/LegacyError" },
          "429": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/exchange/status/{id}": {
      "get": {
        "operationId": "getExchangeStatus",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Read requester-owned exchange status",
        "security": [{ "agentBearer": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }],
        "responses": {
          "200": { "description": "Current exchange state", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExchangeStatus" } } } },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/exchange/fulfill": {
      "post": {
        "operationId": "fulfillExchange",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Reserve an eligible exchange using its fulfillment token",
        "security": [{ "agentBearer": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/FulfillExchangeInput" } } } },
        "responses": {
          "200": { "description": "Exchange reserved for this fulfiller", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExchangeReserved" } } } },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "409": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/exchange/submit/{id}": {
      "post": {
        "operationId": "submitExchange",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Submit an encrypted exchange payload",
        "security": [{ "agentBearer": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/EncryptedPayload" } } } },
        "responses": {
          "201": { "description": "Encrypted payload accepted; the payload is not echoed", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExchangeSubmitted" } } } },
          "400": { "$ref": "#/components/responses/LegacyError" },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "409": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" },
          "413": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/exchange/retrieve/{id}": {
      "get": {
        "operationId": "retrieveExchange",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Retrieve and consume a submitted exchange once",
        "security": [{ "agentBearer": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }],
        "responses": {
          "200": { "description": "Encrypted payload for the requester", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ExchangeRetrieved" } } } },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "409": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v2/secret/exchange/revoke/{id}": {
      "delete": {
        "operationId": "revokeExchange",
        "tags": ["Compatibility"],
        "x-blindpass-contract": "legacy-machine",
        "summary": "Revoke an exchange within the requester's authorized scope",
        "description": "CT12 issuer-admin behavior remains a product decision; the P02 implementation must use the accepted controller policy and preserve the recorded requester behavior.",
        "security": [{ "agentBearer": [] }, { "externalWorkloadBearer": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }],
        "responses": {
          "200": { "description": "Exchange revoked", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RevokedResponse" } } } },
          "401": { "$ref": "#/components/responses/LegacyError" },
          "410": { "$ref": "#/components/responses/LegacyError" }
        }
      }
    },
    "/api/v3/capabilities": {
      "get": {
        "operationId": "getCapabilities",
        "tags": ["Capabilities"],
        "summary": "Report enabled controller API groups and local setup state",
        "responses": {
          "200": { "description": "Controller API capabilities", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CapabilitiesResponse" } } } }
        }
      }
    },
    "/api/v3/admin/bootstrap": {
      "post": {
        "operationId": "bootstrapAdministrator",
        "tags": ["Local administration"],
        "summary": "Create the first local administrator",
        "description": "Requires the explicit local bootstrap capability. Returns 409 once an administrator exists; never enables unauthenticated first-visitor setup.",
        "security": [{ "bootstrapCapability": [] }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/BootstrapInput" } } } },
        "responses": {
          "201": { "description": "First administrator created", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AdminSessionResponse" } } } },
          "400": { "$ref": "#/components/responses/AdminError" },
          "409": { "$ref": "#/components/responses/AdminError" }
        }
      }
    },
    "/api/v3/admin/session/login": {
      "post": {
        "operationId": "loginAdministrator",
        "tags": ["Local administration"],
        "summary": "Authenticate a local operator",
        "description": "Validates Origin and pre-session CSRF. Successful sessions use an HttpOnly Secure SameSite=Strict cookie scoped to /.",
        "parameters": [{ "$ref": "#/components/parameters/Origin" }, { "$ref": "#/components/parameters/CsrfHeader" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LoginInput" } } } },
        "responses": {
          "200": { "description": "Local session established", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AdminSessionResponse" } } } },
          "401": { "$ref": "#/components/responses/AdminError" },
          "403": { "$ref": "#/components/responses/AdminError" }
        }
      }
    },
    "/api/v3/admin/session/logout": {
      "post": {
        "operationId": "logoutAdministrator",
        "tags": ["Local administration"],
        "summary": "Revoke the current local session",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "responses": { "204": { "description": "Session revoked and cookies cleared" }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/session/refresh": {
      "post": {
        "operationId": "refreshAdministratorSession",
        "tags": ["Local administration"],
        "summary": "Rotate the local refresh session",
        "description": "The server revokes the whole rotation family when replay or recovery is detected.",
        "security": [{ "adminRefresh": [], "csrfCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "responses": { "200": { "description": "Session rotated", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AdminSessionResponse" } } } }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/session": {
      "get": {
        "operationId": "getAdministratorSession",
        "tags": ["Local administration"],
        "summary": "Read the current local session and CSRF value",
        "security": [{ "adminSession": [] }],
        "responses": { "200": { "description": "Current session", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AdminSession" } } } }, "401": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/session/change-password": {
      "post": {
        "operationId": "changeAdministratorPassword",
        "tags": ["Local administration"],
        "summary": "Change the current operator password",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ChangePasswordInput" } } } },
        "responses": { "204": { "description": "Password changed and other sessions revoked" }, "400": { "$ref": "#/components/responses/AdminError" }, "401": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/operators": {
      "get": {
        "operationId": "listOperators",
        "tags": ["Local administration"],
        "summary": "List local operators",
        "security": [{ "adminSession": [] }],
        "responses": { "200": { "description": "Operators", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/OperatorList" } } } }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" } }
      },
      "post": {
        "operationId": "createOperator",
        "tags": ["Local administration"],
        "summary": "Create a local operator or viewer",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateOperatorInput" } } } },
        "responses": { "201": { "description": "Operator created", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Operator" } } } }, "400": { "$ref": "#/components/responses/AdminError" }, "409": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/operators/{id}": {
      "patch": {
        "operationId": "updateOperator",
        "tags": ["Local administration"],
        "summary": "Change an operator role or display name",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }, { "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UpdateOperatorInput" } } } },
        "responses": { "200": { "description": "Operator updated", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Operator" } } } }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" }, "404": { "$ref": "#/components/responses/AdminError" }, "409": { "$ref": "#/components/responses/AdminError" } }
      },
      "delete": {
        "operationId": "deleteOperator",
        "tags": ["Local administration"],
        "summary": "Remove an operator without removing the final administrator",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }, { "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "responses": { "204": { "description": "Operator removed" }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" }, "404": { "$ref": "#/components/responses/AdminError" }, "409": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/operators/{id}/reset-password": {
      "post": {
        "operationId": "resetOperatorPassword",
        "tags": ["Local administration"],
        "summary": "Issue a one-time temporary password",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }, { "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "responses": { "200": { "description": "Temporary password returned once", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TemporaryPassword" } } } }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" }, "404": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/agents": {
      "get": {
        "operationId": "listLocalAgents",
        "tags": ["Local administration"],
        "summary": "List enrolled local agents",
        "security": [{ "adminSession": [] }],
        "responses": { "200": { "description": "Agents", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentList" } } } }, "401": { "$ref": "#/components/responses/AdminError" }, "403": { "$ref": "#/components/responses/AdminError" } }
      },
      "post": {
        "operationId": "enrollLocalAgent",
        "tags": ["Local administration"],
        "summary": "Enroll an agent and return its bootstrap key once",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
        "requestBody": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CreateAgentInput" } } } },
        "responses": { "201": { "description": "Agent and one-time bootstrap key", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AgentCreated" } } } }, "400": { "$ref": "#/components/responses/AdminError" }, "409": { "$ref": "#/components/responses/AdminError" } }
      }
    },
    "/api/v3/admin/agents/{id}/rotate-key": {
      "post": {
        "operationId": "rotateAgentKey",
        "tags": ["Local administration"],
        "summary": "Rotate an agent bootstrap key and return it once",
        "security": [{ "adminSession": [], "csrfCookie": [] }],
        "parameters": [{ "in": "path", "name": "id", "required": true, "schema": { "type": "string" } }, { "$ref": "#/components/parameters/CsrfHeader" }, { "$ref": "#/components/parameters/Origin" }],
