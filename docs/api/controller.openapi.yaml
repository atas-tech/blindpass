      "agentApiKey": { "type": "apiKey", "in": "header", "name": "x-agent-api-key" },
      "browserSignedLink": { "type": "apiKey", "in": "query", "name": "sig", "description": "Expiry-bound HMAC signature scoped to the route operation" },
      "bootstrapCapability": { "type": "apiKey", "in": "header", "name": "x-blindpass-bootstrap-token" },
      "adminSession": { "type": "apiKey", "in": "cookie", "name": "bp_session", "description": "Local operator session cookie. While the operator must change a temporary password (bootstrap, local reset or test fixture), every administrative route other than session read, refresh, logout and change-password answers 403 with error password_change_required." },
      "adminRefresh": { "type": "apiKey", "in": "cookie", "name": "bp_refresh" },
      "csrfCookie": { "type": "apiKey", "in": "cookie", "name": "bp_csrf" },
      "seedToken": { "type": "apiKey", "in": "header", "name": "x-blindpass-seed-token" }
    },
    "parameters": {
      "Origin": { "name": "Origin", "in": "header", "required": true, "schema": { "type": "string", "format": "uri" } },
      "CsrfHeader": { "name": "X-CSRF-Token", "in": "header", "required": true, "schema": { "type": "string" }, "description": "Must match the authenticated session's server-side CSRF value and bp_csrf cookie." },
      "IdempotencyKey": { "name": "Idempotency-Key", "in": "header", "required": true, "schema": { "type": "string", "minLength": 16, "maxLength": 128 } }
    },
    "responses": {
      "LegacyError": { "description": "Legacy route-specific response body preserved from the SPS snapshot", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LegacyError" } } } },
      "AdminError": { "description": "Local administration error", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AdminError" } } } }
    },
    "schemas": {
      "HealthResponse": { "type": "object", "properties": { "ok": { "type": "boolean", "const": true } }, "required": ["ok"], "additionalProperties": false },
      "ReadinessResponse": { "type": "object", "properties": { "ok": { "type": "boolean" }, "checks": { "type": "object", "properties": { "database": { "type": "string", "enum": ["up", "down"] } }, "required": ["database"], "additionalProperties": false } }, "required": ["ok", "checks"], "additionalProperties": false },
      "LegacyError": { "type": "object", "properties": { "code": { "type": "string" }, "error": { "type": "string" }, "message": { "type": "string" }, "statusCode": { "type": "integer" } }, "additionalProperties": true },
      "AdminError": { "type": "object", "properties": { "error": { "type": "string" }, "message": { "type": "string" } }, "required": ["error"], "additionalProperties": false },
      "Agent": { "type": "object", "properties": { "id": { "type": "string" }, "agent_id": { "type": "string" }, "workspace_id": { "type": "string" }, "display_name": { "type": "string" }, "status": { "type": "string", "enum": ["active", "revoked"] }, "created_at": { "type": "string", "format": "date-time" }, "revoked_at": { "type": ["string", "null"], "format": "date-time" } }, "required": ["id", "agent_id", "workspace_id", "display_name", "status", "created_at", "revoked_at"], "additionalProperties": false },
      "AgentTokenResponse": { "type": "object", "properties": { "access_token": { "type": "string" }, "access_token_expires_at": { "type": "integer" }, "agent": { "$ref": "#/components/schemas/Agent" } }, "required": ["access_token", "access_token_expires_at", "agent"], "additionalProperties": false },
      "SecretRequestInput": { "type": "object", "properties": { "public_key": { "type": "string", "minLength": 4, "maxLength": 2048, "pattern": "^[A-Za-z0-9+/]+={0,2}$" }, "description": { "type": "string", "minLength": 1, "maxLength": 512 } }, "required": ["public_key", "description"], "additionalProperties": false },
      "SecretRequestCreated": { "type": "object", "properties": { "request_id": { "type": "string" }, "confirmation_code": { "type": "string" }, "secret_url": { "type": "string", "format": "uri" } }, "required": ["request_id", "confirmation_code", "secret_url"], "additionalProperties": false },
      "SecretMetadata": { "type": "object", "properties": { "public_key": { "type": "string" }, "description": { "type": "string" }, "confirmation_code": { "type": "string" }, "expiry": { "type": "integer" } }, "required": ["public_key", "description", "confirmation_code", "expiry"], "additionalProperties": false },
      "EncryptedPayload": { "type": "object", "properties": { "enc": { "type": "string", "minLength": 4, "maxLength": 4096, "pattern": "^[A-Za-z0-9+/]+={0,2}$" }, "ciphertext": { "type": "string", "minLength": 4, "maxLength": 524288, "pattern": "^[A-Za-z0-9+/]+={0,2}$" } }, "required": ["enc", "ciphertext"], "additionalProperties": false },
      "SubmittedResponse": { "type": "object", "properties": { "status": { "type": "string", "const": "submitted" } }, "required": ["status"], "additionalProperties": false },
      "SecretStatus": { "type": "object", "properties": { "status": { "type": "string", "enum": ["pending", "submitted"] } }, "required": ["status"], "additionalProperties": false },
      "ExpiredStatus": { "type": "object", "properties": { "status": { "type": "string", "const": "expired" } }, "required": ["status"], "additionalProperties": false },
      "ExchangeRequestInput": { "type": "object", "properties": { "public_key": { "type": "string", "minLength": 4, "maxLength": 2048, "pattern": "^[A-Za-z0-9+/]+={0,2}$" }, "secret_name": { "type": "string", "minLength": 3, "maxLength": 256 }, "purpose": { "type": "string", "minLength": 1, "maxLength": 256 }, "fulfiller_hint": { "type": "string", "minLength": 1, "maxLength": 512 }, "prior_exchange_id": { "type": "string" } }, "required": ["public_key", "secret_name", "purpose", "fulfiller_hint"], "additionalProperties": false },
      "PolicyDecision": { "type": "object", "properties": { "mode": { "type": "string", "enum": ["allow", "pending_approval", "deny"] }, "reason": { "type": "string" }, "rule_id": { "type": ["string", "null"] }, "secret_name": { "type": "string" }, "requester_ring": { "type": ["string", "null"] }, "fulfiller_ring": { "type": ["string", "null"] }, "approval_required": { "type": "boolean" }, "approval_reference": { "type": ["string", "null"] } }, "required": ["mode", "reason", "rule_id", "secret_name", "requester_ring", "fulfiller_ring", "approval_required", "approval_reference"], "additionalProperties": false },
      "ExchangeRequestCreated": { "type": "object", "properties": { "exchange_id": { "type": "string" }, "status": { "type": "string", "const": "pending" }, "expires_at": { "type": "integer" }, "fulfillment_token": { "type": "string" }, "policy": { "$ref": "#/components/schemas/PolicyDecision" } }, "required": ["exchange_id", "status", "expires_at", "fulfillment_token", "policy"], "additionalProperties": false },
      "ExchangePolicyDenial": { "type": "object", "properties": { "error": { "type": "string" }, "approval_status": { "type": ["string", "null"], "enum": ["pending", null] }, "policy": { "$ref": "#/components/schemas/PolicyDecision" } }, "required": ["error"], "additionalProperties": false },
      "ExchangeStatus": { "type": "object", "properties": { "status": { "type": "string", "enum": ["pending", "reserved", "submitted", "revoked"] } }, "required": ["status"], "additionalProperties": false },
      "FulfillExchangeInput": { "type": "object", "properties": { "fulfillment_token": { "type": "string", "minLength": 32, "maxLength": 4096 } }, "required": ["fulfillment_token"], "additionalProperties": false },
      "ExchangeReserved": { "type": "object", "properties": { "exchange_id": { "type": "string" }, "status": { "type": "string", "const": "reserved" }, "fulfilled_by": { "type": "string" }, "requester_id": { "type": "string" }, "requester_public_key": { "type": "string" }, "secret_name": { "type": "string" }, "purpose": { "type": "string" }, "expires_at": { "type": "integer" }, "policy": { "$ref": "#/components/schemas/PolicyDecision" } }, "required": ["exchange_id", "status", "fulfilled_by", "requester_id", "requester_public_key", "secret_name", "purpose", "expires_at", "policy"], "additionalProperties": false },
      "ExchangeSubmitted": { "type": "object", "properties": { "status": { "type": "string", "const": "submitted" }, "fulfilled_by": { "type": "string" }, "retrieve_by": { "type": "integer" } }, "required": ["status", "fulfilled_by", "retrieve_by"], "additionalProperties": false },
      "ExchangeRetrieved": { "type": "object", "properties": { "enc": { "type": "string" }, "ciphertext": { "type": "string" }, "secret_name": { "type": "string" }, "fulfilled_by": { "type": ["string", "null"] } }, "required": ["enc", "ciphertext", "secret_name", "fulfilled_by"], "additionalProperties": false },
      "RevokedResponse": { "type": "object", "properties": { "status": { "type": "string", "const": "revoked" } }, "required": ["status"], "additionalProperties": false },
      "BrowserStatusCapabilityResponse": { "type": "object", "properties": { "status_sig": { "type": "string", "minLength": 16 } }, "required": ["status_sig"], "additionalProperties": false },
      "CapabilitiesResponse": { "type": "object", "properties": { "api": { "type": "array", "items": { "type": "string", "enum": ["compat.v2", "admin.v3"] } }, "version": { "type": "string" }, "schema_version": { "type": "integer" }, "setup_required": { "type": "boolean" }, "features": { "type": "object", "properties": { "browser_status": { "type": "boolean", "const": true } }, "required": ["browser_status"], "additionalProperties": false } }, "required": ["api", "version", "schema_version", "setup_required", "features"], "additionalProperties": false },
      "BootstrapInput": { "type": "object", "properties": { "username": { "type": "string", "minLength": 3, "maxLength": 128 }, "password": { "type": "string", "minLength": 12, "maxLength": 1024 }, "display_name": { "type": "string", "minLength": 1, "maxLength": 160 } }, "required": ["username", "password", "display_name"], "additionalProperties": false },
      "LoginInput": { "type": "object", "properties": { "username": { "type": "string" }, "password": { "type": "string" } }, "required": ["username", "password"], "additionalProperties": false },
      "AdminSession": { "type": "object", "properties": { "operator": { "$ref": "#/components/schemas/Operator" }, "csrf_token": { "type": "string" }, "expires_at": { "type": "integer" }, "must_change_password": { "type": "boolean" } }, "required": ["operator", "csrf_token", "expires_at", "must_change_password"], "additionalProperties": false },
      "AdminSessionResponse": { "type": "object", "properties": { "operator": { "$ref": "#/components/schemas/Operator" }, "csrf_token": { "type": "string" }, "expires_at": { "type": "integer" }, "must_change_password": { "type": "boolean" } }, "required": ["operator", "csrf_token", "expires_at", "must_change_password"], "additionalProperties": false },
      "ChangePasswordInput": { "type": "object", "properties": { "current_password": { "type": "string" }, "new_password": { "type": "string", "minLength": 12, "maxLength": 1024 } }, "required": ["current_password", "new_password"], "additionalProperties": false },
      "Operator": { "type": "object", "properties": { "id": { "type": "string" }, "username": { "type": "string" }, "display_name": { "type": "string" }, "role": { "type": "string", "enum": ["admin", "operator", "viewer"] }, "disabled_at": { "type": ["string", "null"], "format": "date-time" } }, "required": ["id", "username", "display_name", "role", "disabled_at"], "additionalProperties": false },
      "OperatorList": { "type": "object", "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/Operator" } }, "next_cursor": { "type": ["string", "null"] } }, "required": ["items", "next_cursor"], "additionalProperties": false },
      "CreateOperatorInput": { "type": "object", "properties": { "username": { "type": "string", "minLength": 3, "maxLength": 128 }, "display_name": { "type": "string", "minLength": 1, "maxLength": 160 }, "role": { "type": "string", "enum": ["admin", "operator", "viewer"] }, "password": { "type": "string", "minLength": 12, "maxLength": 1024 } }, "required": ["username", "display_name", "role", "password"], "additionalProperties": false },
      "UpdateOperatorInput": { "type": "object", "properties": { "display_name": { "type": "string", "minLength": 1, "maxLength": 160 }, "role": { "type": "string", "enum": ["admin", "operator", "viewer"] } }, "minProperties": 1, "additionalProperties": false },
      "TemporaryPassword": { "type": "object", "properties": { "temporary_password": { "type": "string" } }, "required": ["temporary_password"], "additionalProperties": false },
      "AgentList": { "type": "object", "properties": { "items": { "type": "array", "items": { "$ref": "#/components/schemas/Agent" } }, "next_cursor": { "type": ["string", "null"] } }, "required": ["items", "next_cursor"], "additionalProperties": false },
      "CreateAgentInput": { "type": "object", "properties": { "agent_id": { "type": "string", "minLength": 1, "maxLength": 128 }, "display_name": { "type": "string", "minLength": 1, "maxLength": 160 } }, "required": ["agent_id", "display_name"], "additionalProperties": false },
      "AgentCreated": { "type": "object", "properties": { "agent": { "$ref": "#/components/schemas/Agent" }, "bootstrap_api_key": { "type": "string" } }, "required": ["agent", "bootstrap_api_key"], "additionalProperties": false },
      "PolicyDocument": { "type": "object", "properties": { "version": { "type": "integer" }, "policy": { "$ref": "#/components/schemas/PolicyDocumentInput" } }, "required": ["version", "policy"], "additionalProperties": false },
