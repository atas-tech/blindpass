<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Secret input · BlindPass</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <script type="module" src="/src/app.js"></script>
  </head>
  <body>
    <div class="product">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="brand-word">blindpass<span class="brand-dot">.</span></span>
          <span class="sr-only" data-i18n="brand.name">BlindPass</span>
        </div>
        <div class="header-actions">
          <span class="header-caption" data-i18n="brand.caption">Secret handoff</span>
          <label class="language">
            <span class="sr-only" data-i18n="language.label">Language</span>
            <select id="language" data-testid="language">
              <option value="en" lang="en">English</option>
              <option value="vi" lang="vi">Tiếng Việt</option>
            </select>
          </label>
        </div>
      </header>

      <main class="layout">
        <section class="intro" aria-labelledby="page-title">
          <p class="eyebrow" data-i18n="intro.eyebrow">A private handoff</p>
          <h1 id="page-title">
            <span data-i18n="intro.titleLine1">Share a secret.</span>
            <span data-i18n="intro.titleLine2">Keep it out of chat.</span>
          </h1>
          <p class="lead" data-i18n="intro.lead" data-i18n-fleet="fleet.intro.lead"></p>
          <ol class="handoff" data-i18n-aria-label="intro.stepsLabel">
            <li>
              <span class="step-number" aria-hidden="true">01</span>
              <div>
                <h2 data-i18n="intro.step1Title" data-i18n-fleet="fleet.intro.step1Title"></h2>
                <p data-i18n="intro.step1Body" data-i18n-fleet="fleet.intro.step1Body"></p>
              </div>
            </li>
            <li>
              <span class="step-number" aria-hidden="true">02</span>
              <div>
                <h2 data-i18n="intro.step2Title" data-i18n-fleet="fleet.intro.step2Title"></h2>
                <p data-i18n="intro.step2Body" data-i18n-fleet="fleet.intro.step2Body"></p>
              </div>
            </li>
            <li>
              <span class="step-number" aria-hidden="true">03</span>
              <div>
                <h2 data-i18n="intro.step3Title" data-i18n-fleet="fleet.intro.step3Title"></h2>
                <p data-i18n="intro.step3Body" data-i18n-fleet="fleet.intro.step3Body"></p>
              </div>
            </li>
          </ol>
          <div class="boundary">
            <span class="boundary-mark" data-icon="arrow-right" aria-hidden="true"></span>
            <p data-i18n="intro.boundary" data-i18n-fleet="fleet.intro.boundary"></p>
          </div>
        </section>

        <section id="secret-card" class="request-card" data-state="loading" aria-labelledby="card-label">
          <div class="card-header">
            <p id="card-label" class="eyebrow" data-i18n="card.label" data-i18n-fleet="fleet.card.label">Secret request</p>
            <span id="status-badge" class="status-badge" data-tone="neutral" data-testid="status"></span>
          </div>

          <div id="entry-panel" hidden>
            <div id="fleet-summary" class="request-summary" hidden>
              <p class="small-label" data-i18n="fleet.purposeLabel"></p>
              <p id="fleet-purpose" class="request-description" data-testid="fleet-purpose" dir="auto"></p>
              <p class="hint" data-i18n="fleet.purposeHint"></p>
              <dl class="fleet-facts">
                <div>
                  <dt class="small-label" data-i18n="fleet.workloadLabel"></dt>
                  <dd id="fleet-workload" data-testid="fleet-workload" dir="auto"></dd>
                </div>
                <div>
                  <dt class="small-label" data-i18n="fleet.unitLabel"></dt>
                  <dd id="fleet-unit" class="mono" data-testid="fleet-unit"></dd>
                </div>
                <div>
                  <dt class="small-label" data-i18n="fleet.credentialLabel"></dt>
                  <dd id="fleet-credential" class="mono" data-testid="fleet-credential"></dd>
                </div>
                <div>
                  <dt class="small-label" data-i18n="fleet.expiryLabel"></dt>
                  <dd id="fleet-expiry" class="expiry" data-testid="fleet-expiry"></dd>
                </div>
              </dl>
              <p class="hint" data-i18n="fleet.destinationHint"></p>
            </div>
            <div id="legacy-summary" class="request-summary">
              <p class="small-label" data-i18n="card.descriptionLabel"></p>
              <p id="request-description" class="request-description" data-testid="request-description" dir="auto"></p>
              <p class="hint" data-i18n="card.descriptionHint"></p>
              <div class="confirmation">
                <div class="confirmation-head">
                  <span class="small-label" data-i18n="card.codeLabel"></span>
                  <span id="expiry" class="expiry" data-testid="expiry"></span>
                </div>
                <p id="confirmation-code" class="confirmation-code" data-testid="confirmation-code"></p>
                <p class="hint" data-i18n="card.codeHint"></p>
                <p id="expiry-hint" class="hint" data-i18n="card.validUntilHint" hidden></p>
              </div>
            </div>

            <form id="secret-form" novalidate autocomplete="off">
              <div class="field-heading">
                <label id="secret-label" for="secret-single" data-i18n="form.secretLabel" data-i18n-fleet="fleet.form.secretLabel"></label>
                <button id="clear" type="button" class="text-button" data-i18n="form.clear" data-testid="clear"></button>
              </div>
              <div id="single-field" class="secret-field">
                <input
                  id="secret-single"
                  name="secret"
                  type="password"
                  autocomplete="off"
                  autocapitalize="off"
                  autocorrect="off"
                  spellcheck="false"
                  aria-describedby="input-help input-error"
                  data-testid="secret-input"
                />
                <button id="visibility" type="button" class="reveal" aria-pressed="false" aria-controls="secret-single" data-testid="visibility"></button>
              </div>
              <textarea
                id="secret-multi"
                name="secret-multiline"
                rows="7"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                aria-describedby="input-help input-error"
                data-testid="secret-input-multi"
                hidden
              ></textarea>
              <div class="input-options">
                <label class="checkbox-label">
                  <input id="multiline" type="checkbox" data-testid="multiline" />
                  <span data-i18n="form.multiline"></span>
                </label>
                <span id="input-size" class="input-size" data-testid="input-size"></span>
              </div>
              <p id="input-help" class="hint"></p>
              <p id="input-error" class="field-error" role="alert" data-testid="input-error" hidden></p>
              <button id="submit" type="submit" class="primary" data-testid="submit-btn">
                <span data-i18n="form.submit"></span>
                <span class="primary-mark" data-icon="arrow-up-right" aria-hidden="true"></span>
              </button>
              <p class="form-footnote" data-i18n="form.footnote" data-i18n-fleet="fleet.form.footnote"></p>
            </form>
            <div class="card-footer">
              <span class="footer-dot" aria-hidden="true"></span>
              <p data-i18n="card.addressReminder"></p>
            </div>
          </div>

          <div id="outcome-panel" class="outcome" data-tone="neutral" data-testid="outcome">
            <span id="outcome-symbol" class="outcome-symbol" aria-hidden="true"></span>
            <h2 id="outcome-title" tabindex="-1" data-testid="outcome-title"></h2>
            <p id="outcome-body" data-testid="outcome-body"></p>
            <p id="outcome-note" class="outcome-note" data-testid="outcome-note"></p>
            <button id="outcome-action" type="button" class="secondary" data-testid="outcome-action" hidden></button>
            <a id="outcome-link" class="secondary outcome-link" data-testid="outcome-link" target="_blank" rel="noopener noreferrer" hidden></a>
            <p id="outcome-followup" class="hint outcome-followup" hidden></p>
          </div>
          <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
        </section>
      </main>

      <footer class="page-footer">
        <span data-i18n="footer.label">BlindPass / Secret input</span>
        <span data-i18n="footer.detail" data-i18n-fleet="fleet.footer.detail">One request. One encrypted handoff.</span>
      </footer>
    </div>
    <noscript><p class="noscript">This page needs JavaScript to encrypt your secret before sending it.</p></noscript>
  </body>
</html>
