# Opt-in locked SQLite upgrade job. Never include this file for ordinary up.
# Run only with the controller stopped and the authority record fenced; it takes a
# verified encrypted pre-upgrade backup before migrating an older schema.
services:
  controller-upgrade:
    profiles: [upgrade]
    image: ${BLINDPASS_CONTROLLER_IMAGE:-ghcr.io/atas-tech/blindpass-controller:0.1.0}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      core: 0
    stop_grace_period: 10s
    restart: "no"
    healthcheck:
      disable: true
    entrypoint: [/usr/bin/timeout, --signal=TERM, --kill-after=10s, 15m, /usr/local/bin/blindpass]
    command: [migrate, --pre-upgrade-backup-dir, /data/pre-upgrade-backups, --signing-credential-file, /recovery/signing.pem, --recipient-certificate-file, /recovery/recipient-certificate.pem]
    environment:
      BLINDPASS_PUBLIC_URL: ${BLINDPASS_PUBLIC_URL:?set the public HTTPS origin}
      BLINDPASS_UI_BASE_URL: ${BLINDPASS_UI_BASE_URL:?set the public HTTPS input origin}
      BLINDPASS_PROXY_REQUIRED: "1"
      BLINDPASS_TRUST_PROXY: ${BLINDPASS_TRUST_PROXY:?set the exact trusted HTTPS edge peer}
      BLINDPASS_CONTROLLER_TENANT_ID: ${BLINDPASS_CONTROLLER_TENANT_ID:?set the tenant ID registered in the recovery authority}
      BLINDPASS_CONTROLLER_OWNER_ID: ${BLINDPASS_CONTROLLER_OWNER_ID:?set the owner ID registered in the recovery authority}
      BLINDPASS_AUTHORITY_URL_FILE: /authority/authority-url
    volumes:
      - blindpass-data:/data
      - blindpass-keys:/keys:ro
      - type: bind
        source: ${BLINDPASS_AUTHORITY_CONFIG_DIR:?set the private UID10001 authority config directory}
        target: /authority
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BLINDPASS_BACKUP_RECOVERY_DIR:?set the protected UID10001 directory holding signing.pem and recipient-certificate.pem}
        target: /recovery
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m,uid=10001,gid=10001,mode=0700
    networks: [edge]
volumes:
  blindpass-data: {}
  blindpass-keys: {}
