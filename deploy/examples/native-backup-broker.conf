# SPDX-License-Identifier: AGPL-3.0-only
# Reviewed example (not VM-verified with real restic): install as
# /etc/systemd/system/blindpass-broker.service.d/native-backup.conf to deliver the
# repository password of deploy/examples/example-backup.service.
#
# ExecStart= is REPLACED, not merged. This line repeats the arguments of
# deploy/native/blindpass-broker.service and adds only the two flags below. If
# another drop-in (for example deploy/examples/browser-runtime.conf) also sets
# ExecStart=, merge the flags into one line; the last drop-in wins.
#
#   --map example-backup.service=restic-password
#       the only unit that may load this credential, bound to the unit identity
#       the kernel reports for the connecting process.
#   --credential-profile restic-password=password-file
#       validate raw password bytes at provisioning (after the one-use HPKE key
#       is opened and before anything is stored) and again at every delivery. The
#       profile applies to every unit mapped to the credential name
#       restic-password. An unknown profile name, or a profile for a credential
#       no --map names, is a startup error.
#
#   --credential-lifetime-seconds N   (optional, 60 to 604800, default 3600)
#       how long a provisioned credential stays in broker memory. The default of
#       one hour means the daily timer in example-backup.timer finds a credential
#       only when the operator provisioned shortly before. A longer value keeps
#       the plaintext in memory longer and still ends at broker restart or reboot;
#       add it to ExecStart below only if that trade-off is accepted.
#
# To roll back, remove the drop-in (or just the --credential-profile flag and
# restart the broker). The credential then loads without validation as before.
# Restarting the broker discards every in-memory credential: re-provision it.
[Service]
ExecStart=
ExecStart=/usr/libexec/blindpass-broker --loader-socket /run/blindpass/loader.sock --workload-socket /run/blindpass/workload.sock --provision-socket /run/blindpass/provision.sock --control-socket /run/blindpass/control.sock --key-directory /var/lib/blindpass/broker --workload-group blindpass-workload --node-group blindpass-node --map blindpass-consumer.service=api-key --map blindpass-backup.service=api-key --map example-backup.service=restic-password --credential-profile restic-password=password-file
