# Reviewed staging opt-in: install as blindpass-broker.service.d/browser.conf
# only after installing the private runtime, fixed resources and service units.
[Unit]
After=systemd-tmpfiles-setup.service
Wants=blindpass-login-helper.socket blindpass-browser.socket blindpass-browser-supervisor.socket blindpass-session-revoker.socket blindpass-runtime-manager.socket
[Service]
ExecStart=
ExecStart=/usr/libexec/blindpass-broker --loader-socket /run/blindpass/loader.sock --workload-socket /run/blindpass/workload.sock --provision-socket /run/blindpass/provision.sock --control-socket /run/blindpass/control.sock --key-directory /var/lib/blindpass/broker --workload-group blindpass-workload --node-group blindpass-node --map blindpass-consumer.service=api-key --map blindpass-backup.service=api-key --map blindpass-login-helper@.service=primary-password --map blindpass-session-revoker@.service=fixture-admin --browser-resources --browser-runtime
ReadWritePaths=/run/blindpass-runtime /run/blindpass-helper-identity

# ---------------------------------------------------------------------------
# Network destination scope (documentation only; nothing below is active).
#
# The Root browser supervisor and the private login helper reach the website
# through the application authority (host:port) of the administrator recipe,
# which is a runtime value. systemd can only match literal IP addresses, so the
# shipped units cannot name it and do not restrict IP destinations. The
# restriction is enforced in code:
#   * supervisor: tunnel frames carry no host or port; createApprovedEgressConnector
#     (helpers/login/src/browser-network.mjs) dials only the recipe origin, and the
#     namespace-side CONNECT proxy accepts only that authority;
#   * login helper: private-login.mjs fails every request outside the recipe
#     origin(s) through the CDP Fetch domain, including each redirect hop, and
#     closes WebSockets.
# Do not read RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 on the supervisor
# as "Unix and application only" at the unit level: it permits any IP destination.
#
# Optional hardening when the application has stable literal addresses. Install
# as a separate drop-in per unit (these are NOT part of this broker drop-in) and
# test with the real application first; none of this has been VM-verified.
#
#   /etc/systemd/system/blindpass-browser-supervisor@.service.d/network.conf
#     [Service]
#     IPAddressDeny=any
#     IPAddressAllow=<application IP or CIDR>
#     # Add the DNS resolver address too when the origin is a hostname, or use an
#     # IP-literal origin. AF_UNIX traffic is not affected by IPAddress*.
#
#   /etc/systemd/system/blindpass-login-helper@.service.d/network.conf
#     [Service]
#     IPAddressDeny=any
#     IPAddressAllow=<application IP or CIDR> <DNS resolver IP>
#     # The helper currently sets no RestrictAddressFamilies. Chromium needs
#     # AF_UNIX for its own IPC and typically AF_NETLINK for network-change
#     # monitoring besides AF_INET/AF_INET6; a candidate to evaluate is
#     #   RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
#     # Do not enable it without a Chromium run that exercises the full login.
#
# The Root session revoker has the same address families and the same code-level
# destination (the recipe origin, verified TLS identity and optional SPKI pins);
# the same optional IPAddress* drop-in applies to blindpass-session-revoker@.service.
