# Reviewed example (the same flags are exercised by tests/fleet/p10-vm.py, which writes its own
# drop-in; this file is not installed byte-for-byte): install as
# /etc/systemd/system/blindpass-broker.service.d/fulfillment.conf on the nodes that
# take part in a cross-workload fulfillment. Dummy unit names; replace them.
#
# ExecStart= is REPLACED, not merged. This line repeats the arguments of
# deploy/native/blindpass-broker.service. If another drop-in also sets ExecStart=,
# merge the flags into one line; the last drop-in wins.
#
# ISSUER node (holds the credential a recipient will receive):
#   --map issuer-app.service=api-key
#   --fulfillment-source issuer-app.service
#       the only unit whose mapped credential this broker may seal for another node.
#       Provision the credential first (blindpass-provision --unit issuer-app.service
#       --credential api-key < file); custody is in memory and ends at restart.
#
# RECIPIENT node (receives and serves it):
#   --map recipient-app.service=api-key
#   --fulfillment-destination recipient-app.service
#       the only unit that may receive a fulfilled credential. The unit reads it with
#       LoadCredential=api-key:/run/blindpass/loader.sock like any provisioned one.
#
#   --fulfillment-offer-lifetime-seconds N   (optional, 1 to 180, default 180)
#       how long the one-use receiving key the recipient broker mints stays valid.
#
# Each flag is a local ceiling a controller-signed document cannot widen. A unit named
# by a fulfillment flag must also be named by --map, or the broker refuses to start.
# With neither flag the broker refuses every fulfillment. To roll back, remove the
# drop-in and restart the broker: pending offers, keys and stored credentials are in
# memory and are discarded. A fulfilled credential that a unit already read is outside
# BlindPass and is not recalled.
#
# Also set BLINDPASS_FULFILLMENTS_ENABLED=1 on the controller (deploy/native/controller.env.example).
[Service]
ExecStart=
ExecStart=/usr/libexec/blindpass-broker --loader-socket /run/blindpass/loader.sock --workload-socket /run/blindpass/workload.sock --provision-socket /run/blindpass/provision.sock --control-socket /run/blindpass/control.sock --key-directory /var/lib/blindpass/broker --workload-group blindpass-workload --node-group blindpass-node --map issuer-app.service=api-key --fulfillment-source issuer-app.service
