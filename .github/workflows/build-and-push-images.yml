name: Build And Push Images

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'Build and push API image'
        type: boolean
        default: true
      ui:
        description: 'Build and push UI image'
        type: boolean
        default: true
      controller:
        description: 'Build and push versioned Rust controller candidate with SBOM'
        type: boolean
        default: false
      dashboard:
        description: 'Build and push Dashboard image'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PRODUCTION_VITE_SPS_API_URL: https://sps.atas.tech

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
      api_image: ${{ steps.vars.outputs.api_image }}
      ui_image: ${{ steps.vars.outputs.ui_image }}
      controller_image: ${{ steps.vars.outputs.controller_image }}
      dashboard_image: ${{ steps.vars.outputs.dashboard_image }}
    steps:
      - name: Derive image names
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "api_image=${{ env.REGISTRY }}/$owner/blindpass-sps-server" >> "$GITHUB_OUTPUT"
          echo "ui_image=${{ env.REGISTRY }}/$owner/blindpass-browser-ui" >> "$GITHUB_OUTPUT"
          echo "controller_image=${{ env.REGISTRY }}/$owner/blindpass-controller" >> "$GITHUB_OUTPUT"
          echo "dashboard_image=${{ env.REGISTRY }}/$owner/blindpass-dashboard" >> "$GITHUB_OUTPUT"

  build-api:
    runs-on: ubuntu-latest
    needs: prepare
    if: inputs.api == true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.api_image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/sps-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

  build-ui:
    runs-on: ubuntu-latest
    needs: prepare
    if: inputs.ui == true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract UI image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.ui_image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/browser-ui/Dockerfile
          push: true
          build-args: |
            VITE_SPS_API_URL=${{ vars.VITE_SPS_API_URL || env.PRODUCTION_VITE_SPS_API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui-image
          cache-to: type=gha,mode=max,scope=ui-image

  build-dashboard:
    runs-on: ubuntu-latest
    needs: prepare
    if: inputs.dashboard == true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract dashboard image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.dashboard_image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/dashboard/Dockerfile
          push: true
          build-args: |
            VITE_SPS_API_URL=${{ vars.VITE_SPS_API_URL || env.PRODUCTION_VITE_SPS_API_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dashboard-image
          cache-to: type=gha,mode=max,scope=dashboard-image

  build-controller:
    runs-on: ubuntu-latest
    needs: prepare
    if: inputs.controller == true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Read controller version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build versioned controller and attach SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/controller/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare.outputs.controller_image }}:${{ steps.version.outputs.value }}
            ${{ needs.prepare.outputs.controller_image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          attests: |
            type=sbom,generator=docker/buildkit-syft-scanner:stable-1@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9,"SELECT_CATALOGERS=+sbom-cataloger,+rust-cargo-lock-cataloger,+javascript-package-cataloger,+dpkg-db-cataloger"
            type=provenance,mode=min
          cache-from: type=gha,scope=controller-image
          cache-to: type=gha,mode=max,scope=controller-image
