name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Build and fast checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24.21.0", "26.10.0"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Check Node runtime declarations
        run: node --test scripts/tests/node-runtime.test.mjs

      - name: Run default workspace tests
        run: npm test

      - name: Check landing workflow demos
        run: npm run test:landing

      # P05 helper library, private worker framing and actual Chromium fixture
      # checks (chromiumSandbox: true, no root-only or VM prerequisites).
      - name: Install Playwright Chromium for P05 helper checks
        run: npm exec --workspace=helpers/login -- playwright install --with-deps chromium

      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which stops
      # the Chromium sandbox the P05 tests require. Best effort: a missing key
      # (other images) is ignored and a still-failing sandbox fails the tests.
      - name: Allow the Chromium user-namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run P05 helper and fixture browser tests
        run: |
          npm run test:p05:helper
          npm run test:p05:fixture
          node --test --test-isolation=none tests/browser-handoff/private-login-pins.test.mjs

      - name: Check controller API and generated types
        run: |
          npm run generate:api
          npm run test:controller-openapi
          npm run test:openapi-types --workspace=@blindpass/contract-tests
          git diff --exit-code -- packages/contract-tests/src/generated/controller.d.ts packages/console/src/api/generated/controller.d.ts

      - name: Check contract progress gate
        run: npm run test:contract-progress

  p06-release-baseline:
    name: P06 candidate artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            node-image: node:26.10.0-bookworm@sha256:abbacf6ecd105ed33c408bdca7701c8a54f50e317eabfb3ed31733d4e6951db5
            rust-image: rust:1.98.1-bookworm@sha256:c49256cbe5ea0188bc658a689500d70c41eb51f009a7a7be209caf60a944f3ec
          - arch: aarch64
            runner: ubuntu-24.04-arm
            node-image: node:26.10.0-bookworm@sha256:838c3eef085968cb818717aeb58f0880be18afa10792df051d049501565f724e
            rust-image: rust:1.98.1-bookworm@sha256:5b993f23fb69746405496e76f91e511d96c82b5b23304fd5d20b4a80a8b223ea
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build at the bookworm baseline
        run: |
          docker build --file scripts/release/Dockerfile --target export \
            --build-arg NODE_IMAGE='${{ matrix.node-image }}' \
            --build-arg RUST_IMAGE='${{ matrix.rust-image }}' \
            --output type=local,dest=/tmp/blindpass-p06-binaries .
      - name: Inspect and package embedded controller candidate
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd binutils
          scripts/release/build-tarballs.sh --profile controller --arch '${{ matrix.arch }}' \
            --bin-dir /tmp/blindpass-p06-binaries --output-dir /tmp/blindpass-p06-release
          scripts/release/checksums.sh /tmp/blindpass-p06-release
          cd /tmp/blindpass-p06-release && sha256sum --check SHA256SUMS
      - name: Test actual extracted archive and CLI
        run: |
          python3 tests/deployment/release-artifacts-test.py
          python3 tests/deployment/release-archive.py --arch '${{ matrix.arch }}' \
            --bin-dir /tmp/blindpass-p06-binaries
      # Runtime matrix and node/helper archives are separate real-host gates.
      # This job publishes no images/releases and confers no support guarantee.
