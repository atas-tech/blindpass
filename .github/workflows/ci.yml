name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Build and fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Check landing workflow demos
        run: npm run test:landing

      - name: Check controller API and generated types
        run: |
          npm run generate:api
          npm run test:controller-openapi
          npm run test:openapi-types --workspace=@blindpass/contract-tests
          git diff --exit-code -- packages/contract-tests/src/generated/controller.d.ts

      - name: Check contract progress gate
        run: npm run test:contract-progress
