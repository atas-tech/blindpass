name: Full CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://blindpass:localdev@127.0.0.1:5433/blindpass
  REDIS_URL: redis://127.0.0.1:6380
  SPS_HMAC_SECRET: ci-only-hmac-canary
  SPS_USER_JWT_SECRET: ci-only-user-jwt-canary
  SPS_AGENT_JWT_SECRET: ci-only-agent-jwt-canary

jobs:
  workspace:
    name: Build and workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blindpass
          POSTGRES_USER: blindpass
          POSTGRES_PASSWORD: localdev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blindpass -d blindpass"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Check landing workflow demos
        run: npm run test:landing

      - name: Run default workspace tests
        run: npm test

      - name: Run Redis integration tests
        run: npm run test:integration

      - name: Run PostgreSQL SPS tests
        run: |
          SPS_PG_INTEGRATION=1 npm test --workspace=packages/sps-server -- --reporter=json --outputFile=/tmp/sps-pg-results.json
          node scripts/tests/assert-pg-vitest-gate.mjs /tmp/sps-pg-results.json

      - name: Run PostgreSQL SPS E2E suite
        run: npm run test:e2e --workspace=packages/sps-server

      - name: Install Playwright Chromium
        run: npm exec --workspace=packages/dashboard -- playwright install --with-deps chromium

      - name: Run dashboard Playwright E2E
        run: npm run test:e2e

  contract:
    name: P00 HTTP contract suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blindpass
          POSTGRES_USER: blindpass
          POSTGRES_PASSWORD: localdev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blindpass -d blindpass"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Build workspace and contract harness
        run: npm run build

      - name: Run P00 CT01–CT18, CC01 and CV01–CV06
        env:
          SUT: ts
          CONTRACT_DATABASE_URL: ${{ env.DATABASE_URL }}
          CONTRACT_REDIS_URL: ${{ env.REDIS_URL }}
        run: |
          npm test --workspace=@blindpass/contract-tests -- --reporter=json --outputFile=/tmp/p00-contract-results.json
          node scripts/tests/assert-no-vitest-skips.mjs /tmp/p00-contract-results.json

  base-contract:
    name: P00 harness-spawned base URL adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blindpass
          POSTGRES_USER: blindpass
          POSTGRES_PASSWORD: localdev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blindpass -d blindpass"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://blindpass:localdev@127.0.0.1:5433/blindpass
      REDIS_URL: redis://127.0.0.1:6380
      SPS_HMAC_SECRET: ci-only-hmac-canary
      SPS_USER_JWT_SECRET: ci-only-user-jwt-canary
      SPS_AGENT_JWT_SECRET: ci-only-agent-jwt-canary
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Build workspace and contract harness
        run: npm run build

      - name: Run P00 contract suite through SUT=base
        run: node --import tsx scripts/tests/p00-base-contract.mjs

  contract-rust:
    name: P02 Rust HTTP contract (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blindpass
          POSTGRES_USER: blindpass
          POSTGRES_PASSWORD: localdev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U blindpass -d blindpass"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Install native controller libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libssl-dev

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Build the controller executable
        run: cargo build -p blindpass-controller --locked

      - name: Build the workspace
        run: npm run build

      - name: Run Rust store transition tests
        env:
          P02_TEST_BACKEND: ${{ matrix.backend }}
          P02_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: cargo test -p blindpass-controller --test store_transitions --locked

      - name: Run Rust shell and rich fixture tests
        env:
          P02_TEST_BACKEND: ${{ matrix.backend }}
          P02_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: cargo test -p blindpass-controller --test shell_config --locked

      - name: Run Rust admin HTTP session, role and forced password change tests
        env:
          P02_TEST_BACKEND: ${{ matrix.backend }}
          P02_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: cargo test -p blindpass-controller --test admin_session --locked

      - name: Run P02 I07 PostgreSQL outage and reconnection test
        if: matrix.backend == 'postgres'
        env:
          P02_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: cargo test -p blindpass-controller --test postgres_outage --locked -- --ignored

      - name: Build controller with P02 crash failpoints
        run: CARGO_TARGET_DIR=target/p02-failpoints cargo build -p blindpass-controller --features p02-test-failpoints --locked

      - name: Run P02 I03 process crash and restart scenarios
        env:
          SUT: rust
          CONTRACT_RUST_BACKEND: ${{ matrix.backend }}
          CONTRACT_RUST_BIN: target/p02-failpoints/debug/blindpass-controller
          CONTRACT_DATABASE_URL: ${{ env.DATABASE_URL }}
          CONTRACT_REQUEST_TTL_SECONDS: "180"
          CONTRACT_SUBMITTED_TTL_SECONDS: "180"
          CONTRACT_APPROVAL_TTL_SECONDS: "180"
        run: npm run test:p02:crash

      - name: Run P02 CC02 agent and gateway client flows
        env:
          SUT: rust
          CONTRACT_RUST_BACKEND: ${{ matrix.backend }}
          CONTRACT_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:p02:clients

      - name: Install Chromium for P02 browser flows
        run: npm exec --workspace=packages/dashboard -- playwright install --with-deps chromium

      - name: Run P02 CC02 human and CC03 browser flows
        env:
          NODE_OPTIONS: --import=tsx
          SUT: rust
          CONTRACT_RUST_BACKEND: ${{ matrix.backend }}
          CONTRACT_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:p02-browser --workspace=packages/dashboard

      - name: Run P02 browser flows from packaged nginx image
        env:
          NODE_OPTIONS: --import=tsx
          SUT: rust
          CONTRACT_RUST_BACKEND: ${{ matrix.backend }}
          CONTRACT_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set -e
          docker build -f packages/browser-ui/Dockerfile -t blindpass-p02-browser-csp:${{ matrix.backend }} .
          docker run --detach --rm --name blindpass-p02-browser-csp-${{ matrix.backend }} -p 127.0.0.1::8080 blindpass-p02-browser-csp:${{ matrix.backend }}
          trap 'docker stop blindpass-p02-browser-csp-${{ matrix.backend }}' EXIT
          browser_port="$(docker port blindpass-p02-browser-csp-${{ matrix.backend }} 8080/tcp)"
          P02_PACKAGED_BROWSER_UI_URL="http://127.0.0.1:${browser_port##*:}" npm run test:p02-browser --workspace=packages/dashboard

      - name: Test the contract progress gate
        run: npm run test:contract-progress

      - name: Prove a Rust response mismatch fails the contract gate
        env:
          SUT: rust
          CONTRACT_RUST_BACKEND: ${{ matrix.backend }}
          CONTRACT_DATABASE_URL: ${{ env.DATABASE_URL }}
          P02_INJECT_RESPONSE_MISMATCH: CT01.healthz
        run: |
          set +e
          npm test --workspace=@blindpass/contract-tests -- --reporter=json --outputFile=/tmp/p02-rust-${{ matrix.backend }}-mismatch.json
          test_status=$?
          set -e
          if [ "$test_status" -eq 0 ]; then
            echo "The injected CT01 response mismatch unexpectedly passed."
            exit 1
          fi
          node scripts/tests/assert-no-vitest-skips.mjs /tmp/p02-rust-${{ matrix.backend }}-mismatch.json
          set +e
          node scripts/tests/assert-contract-progress.mjs /tmp/p02-rust-${{ matrix.backend }}-mismatch.json packages/contract-tests/fixtures/rust-pending.json >/tmp/p02-rust-${{ matrix.backend }}-mismatch-gate.log 2>&1
          progress_status=$?
          set -e
          if [ "$progress_status" -eq 0 ] || ! grep -Fq "Unexpected failure for CT01" /tmp/p02-rust-${{ matrix.backend }}-mismatch-gate.log; then
            cat /tmp/p02-rust-${{ matrix.backend }}-mismatch-gate.log
            echo "The progress gate did not reject the injected CT01 mismatch as expected."
            exit 1
          fi
          cat /tmp/p02-rust-${{ matrix.backend }}-mismatch-gate.log

      - name: Run Rust contract progress and skip gates
        env:
          SUT: rust
          CONTRACT_RUST_BACKEND: ${{ matrix.backend }}
          CONTRACT_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          set +e
          npm test --workspace=@blindpass/contract-tests -- --reporter=json --outputFile=/tmp/p02-rust-${{ matrix.backend }}-results.json
          test_status=$?
          node scripts/tests/assert-no-vitest-skips.mjs /tmp/p02-rust-${{ matrix.backend }}-results.json
          skip_status=$?
          node scripts/tests/assert-contract-progress.mjs /tmp/p02-rust-${{ matrix.backend }}-results.json packages/contract-tests/fixtures/rust-pending.json
          progress_status=$?
          if [ "$test_status" -ne 0 ] || [ "$skip_status" -ne 0 ] || [ "$progress_status" -ne 0 ]; then
            exit 1
          fi

  openapi-drift:
    name: P02 controller OpenAPI and generated types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install lockfile dependencies
        run: npm ci

      - name: Generate and validate controller API types
        run: |
          npm run generate:api
          npm run test:controller-openapi
          npm run test:openapi-types --workspace=@blindpass/contract-tests
          npm run build --workspace=@blindpass/contract-tests
          git diff --exit-code -- packages/contract-tests/src/generated/controller.d.ts

      - name: Prove stale generated declarations fail the drift check
        run: |
          generated=packages/contract-tests/src/generated/controller.d.ts
          backup_file="$(mktemp)"
          cp "$generated" "$backup_file"
          trap 'cp "$backup_file" "$generated"; rm -f "$backup_file"' EXIT
          printf '\n// P02 injected stale declaration\n' >> "$generated"
          if node scripts/generate-controller-types.mjs --check; then
            echo "The generated-type check accepted an injected stale declaration."
            exit 1
          fi
          echo "Injected generated declaration drift was rejected."
          cp "$backup_file" "$generated"
          rm -f "$backup_file"
          trap - EXIT
          git diff --exit-code -- packages/contract-tests/src/generated/controller.d.ts

  rust:
    name: Rust broker checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native broker libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libsystemd-dev libssl-dev

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run locked Rust tests
        run: cargo test --workspace --locked
